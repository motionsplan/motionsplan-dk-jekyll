<!-- Chart.js fra CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div style="width: 100%; max-width: 900px; margin: 2rem auto; padding: 1.5rem; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); font-family: system-ui, -apple-system, sans-serif;">
  <h3 style="margin-top: 0; margin-bottom: 0.5rem; text-align: center; color: #2c3e50; font-size: 1.35rem;">
    Mænds gennemsnitshøjde i 20 udvalgte lande (1960–2026)
  </h3>
  <p style="text-align: center; color: #7f8c8d; font-size: 0.85rem; margin-bottom: 1rem;">
    Klik på landenes navne i forklaringen for at slå dem til/fra, eller brug knapperne nedenfor:
  </p>
  
  <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap;">
    <button onclick="showKeyCountries()" style="padding: 6px 14px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600;">Vis nøglelande</button>
    <button onclick="showAllCountries()" style="padding: 6px 14px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600;">Vis alle 20 lande</button>
  </div>
  
  <div style="position: relative; height: 500px; width: 100%;">
    <canvas id="chart20Countries"></canvas>
  </div>
  
  <p style="font-size: 0.75rem; color: #95a5a6; margin-top: 1rem; margin-bottom: 0; text-align: right;">
    Kilde: NCD Risk Factor Collaboration (NCD-RisC), WHO & eLife
  </p>
</div>

  heightChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: years,
      datasets: datasets
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false,
      },
      plugins: {
        legend: {
          position: 'top',
          labels: {
            usePointStyle: true,
            boxWidth: 8,
            font: { size: 10 }
          }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              return context.dataset.label.split(' ')[0] + ': ' + context.parsed.y + ' cm';
            }
          }
        }
      },
      scales: {
        x: {
          title: { display: true, text: 'År' },
          grid: { display: false }
        },
        y: {
          min: 150,
          max: 186,
          title: { display: true, text: 'Gennemsnitshøjde (cm)' },
          ticks: { stepSize: 5 }
        }
      }
    }
  });
});

function showAllCountries() {
  if (!heightChartInstance) return;
  heightChartInstance.data.datasets.forEach(ds => ds.hidden = false);
  heightChartInstance.update();
}

function showKeyCountries() {
  if (!heightChartInstance) return;
  const keyNames = ['Danmark', 'Holland', 'USA', 'Kina', 'Østtimor'];
  heightChartInstance.data.datasets.forEach(ds => {
    const countryName = ds.label.split(' ')[0];
    ds.hidden = !keyNames.includes(countryName);
  });
  heightChartInstance.update();
}
</script>
