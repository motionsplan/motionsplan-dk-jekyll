{% if jekyll.environment == "production" %}
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker
      .register("{{ '/pwabuilder-sw.js' | relative_url }}", {
        scope: "./"
      })
      .then(function (reg) {
        console.log("[{{ site.title }}] Service worker er registreret for scope: " + reg.scope);
      })
      .catch(function (err) {
        console.error("[{{ site.title }}] Service worker kunne ikke registreres:", err);
      });
  });
}
</script>
{% endif %}

{% if page.mathjax or site.mathjax %}
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    svg: {
      fontCache: 'global'
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<script type="module">
  document.addEventListener('DOMContentLoaded', async () => {
    const calculators = document.querySelectorAll('[data-calculator]');

    for (const calc of calculators) {
      const calcType = calc.dataset.calculator;
      
      // Henter specifikt UI-modul fra data-ui-module, hvis det findes, ellers standardnavnet
      const uiModule = calc.dataset.uiModule || `${calcType}-ui`;

      try {
        const module = await import(`/assets/js/ui/${uiModule}.js`);
        module.initCalculator?.(calc);
      } catch (err) {
        console.error(`Fejl ved indlæsning af beregner [${calcType}] via [${uiModule}]:`, err);
      }
    }
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var tocHeaders = document.querySelectorAll('.toc header');
  tocHeaders.forEach(function (header) {
    header.addEventListener('click', function (e) {
      e.preventDefault();
      var tocContainer = header.closest('.toc');
      if (tocContainer) {
        tocContainer.classList.toggle('is-open');
      }
    });
  });
});
</script>
