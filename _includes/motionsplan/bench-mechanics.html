<!-- Plotly CDN -->
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist@2.35.2/plotly.min.js"></script>

<!-- Hent dine lokale scripts fra assets/js/bench/ -->
<script src="{{ '/assets/js/bench/bench-data.js' | relative_url }}"></script>
<script src="{{ '/assets/js/bench/bench-model.js' | relative_url }}"></script>

<fieldset class="mechanics-model">
    <div class="two-columns">
        <div class="column">
            <fieldset>
                <legend>📏 Målinger</legend>
                <div class="form-group">
                    <label><b>Upper Arm</b></label>
                    <input type="range" id="upperarmslider" min="10" max="50" value="30" step="1" />
                    <span id="upperarmvalue">30 cm</span>
                </div>

                <div class="form-group">
                    <label><b>Forearm</b></label>
                    <input type="range" id="forearmslider" min="10" max="50" value="33" step="1" />
                    <span id="forearmvalue">33 cm</span>
                </div>

                <div class="form-group">
                    <label><b>Shoulder Width</b></label>
                    <input type="range" id="shoulderslider" min="20" max="100" value="46" step="1" />
                    <span id="shouldervalue">46 cm</span>
                </div>
            </fieldset>

            <fieldset>
                <legend>📏 Tekniske valg</legend>
                <div class="row">
                    <label class="checkbox form-inline">
                        <input type="checkbox" id="checklock"> <b>Lock Elbows</b>
                    </label>
                </div>

                <div class="form-group" id="elbow-flare">
                    <label><b>Elbow Flare</b></label>
                    <input type="range" id="flareslider" min="0" max="60" value="30" step="1" />
                    <span id="flarevalue">30°</span>
                </div>

                <div class="form-group">
                    <label><b>Grip Width</b></label>
                    <input type="range" id="gripslider" min="0" max="131" value="76" step="1" />
                    <span id="gripvalue">76 cm</span>
                </div>
            </fieldset>
        </div>

        <div class="column">
            <fieldset>
                <legend>❤️ Brystet</legend>
                <div class="form-group">
                    <label><b>Bar Chest Position Height</b></label>
                    <input type="range" id="heightslider" min="0" max="20" value="15" step="1" />
                    <span id="heightvalue">15 cm</span>
                </div>

                <div class="form-group">
                    <label><b>Forward Travel</b></label>
                    <input type="range" id="travelslider" min="0" max="50" value="15" step="1" />
                    <span id="travelvalue">15 cm</span>
                </div>
            </fieldset>

            <fieldset>
                <legend>📈 Bar Path</legend>
                <div class="row">
                    <label class="radio form-inline">
                        <input type="radio" name="barpathradio" id="checkstraight" checked="checked"> Straight
                    </label>
                    <label class="radio form-inline">
                        <input type="radio" name="barpathradio" id="checkBridges"> Bridges
                    </label>
                    <label class="radio form-inline">
                        <input type="radio" name="barpathradio" id="checkKazmaier"> Kazmaier
                    </label>
                </div>
            </fieldset>
        </div>
    </div>

    <fieldset>
        <div class="form-group">
            <label><b>Bænkpres position</b></label>
            <div class="slider-container">
                <span class="label-left">🧍‍♂️ Oppe</span>
                <input type="range" id="positionslider" min="0" max="99" value="0" step="1" />
                <span class="label-right">🧎‍♂️ Nede</span>
            </div>
        </div>
    </fieldset>
</fieldset>

<div class="models">
    <div class="model" id="model2"></div>
    <div class="model" id="model"></div>
</div>
<div class="models">
    <div class="model" id="model3"></div>
    <div class="model"></div>
</div>
<div class="models">
    <div class="graph" id="stats"></div>
</div>
