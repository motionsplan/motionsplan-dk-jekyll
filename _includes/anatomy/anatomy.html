<div id="anatomy_muscle">
  <!-- Hovedbillede -->
  <img src="/assets/images/anatomy/blank-muscle-anatomy.jpg" 
       id="muscles" 
       name="muscles" 
       width="600" 
       height="510" 
       alt="Muskelanatomi" 
       usemap="#muscle-anatomy-map">

  <!-- Imagemap genereret af Jekyll -->
  <map name="muscle-anatomy-map">
    {% assign imagemap = site.anatomy | where: "tags", "imagemap" %}
    {% for m in imagemap %}
      {% for c in m.coords %}
        <area shape="poly" 
              coords="{{ c | split: ',' | join: ',' }}"
              title="{{ m.title }}"
              class="{{ m.slug }}"
              data-slug="{{ m.slug }}"
              data-focus="{{ m.image_focus }}"
              href="#anatomy_muscle" 
              alt="{{ m.title }}"/>
      {% endfor %}
    {% endfor %}
  </map>

  <!-- Popups genereret af Jekyll -->
  {% for m in imagemap %}
    <div class="{{ m.slug }} anatomy-popup">
      <p><strong>{{ m.name.da | default: m.title }}</strong></p>
      <p>Latin: {{ m.name.latin }}</p>
    </div>
  {% endfor %}
</div>

<!-- Rent Vanilla JavaScript uten afhængigheder -->
<script>
document.addEventListener("DOMContentLoaded", function() {
  const container = document.getElementById("anatomy_muscle");
  const mainImage = document.getElementById("muscles");
  const defaultSrc = "/assets/images/anatomy/blank-muscle-anatomy.jpg";

  if (!container || !mainImage) return;

  // 1. Automatisk preloading af alle fokus-billeder i baggrunden (for lynhurtig skift)
  const areas = container.querySelectorAll("area[data-focus]");
  areas.forEach(function(area) {
    const focusSrc = area.getAttribute("data-focus");
    if (focusSrc) {
      const img = new Image();
      img.src = focusSrc;
    }
  });

  // 2. Event Delegation for HOVER OVER muskel
  container.addEventListener("mouseover", function(e) {
    const area = e.target.closest("area");
    if (!area) return;

    const slug = area.getAttribute("data-slug");
    const focusImg = area.getAttribute("data-focus");

    // Skift billede
    if (focusImg) {
      mainImage.src = focusImg;
    }

    // Vis popup
    if (slug) {
      const popups = container.querySelectorAll("." + slug + ".anatomy-popup");
      popups.forEach(function(popup) {
        popup.classList.add("anatomy-popup-on");
      });
    }
  });

  // 3. Event Delegation for HOVER VÆK fra muskel
  container.addEventListener("mouseout", function(e) {
    const area = e.target.closest("area");
    if (!area) return;

    const slug = area.getAttribute("data-slug");

    // Nulstil billede til standard
    mainImage.src = defaultSrc;

    // Skjul popup
    if (slug) {
      const popups = container.querySelectorAll("." + slug + ".anatomy-popup");
      popups.forEach(function(popup) {
        popup.classList.remove("anatomy-popup-on");
      });
    }
  });
});
</script>
