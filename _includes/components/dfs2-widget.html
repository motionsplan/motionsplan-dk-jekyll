<!-- DFS-2 FLOW-SKALA INTERAKTIVT VÆRKTØJ (Wizard Format - motionsplan.dk) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div id="dfs2-card" style="max-width: 720px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); font-family: system-ui, -apple-system, sans-serif;">
  
  <!-- HEADER & PROGRESS BAR -->
  <div id="dfs2-wizard-header" style="border-bottom: 2px solid #f1f5f9; padding-bottom: 16px; margin-bottom: 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
      <div>
        <h3 style="margin: 0; font-size: 1.25rem; font-weight: 800; color: #0f172a;">🌊 DFS-2: Flow-skalaen</h3>
        <span id="dfs2-step-counter" style="font-size: 0.8rem; font-weight: 700; color: #64748b;">Spørgsmål 1 af 9</span>
      </div>
      <span id="dfs2-step-pct" style="background: #ecfdf5; color: #059669; font-size: 0.75rem; font-weight: 800; padding: 6px 12px; border-radius: 20px;">11% færdig</span>
    </div>
    
    <!-- PROGRESS BAR -->
    <div style="width: 100%; background: #f1f5f9; height: 8px; border-radius: 4px; overflow: hidden;">
      <div id="dfs2-progress-bar" style="width: 11%; background: linear-gradient(90deg, #059669 0%, #10b981 100%); height: 100%; transition: width 0.3s ease;"></div>
    </div>
  </div>

  <!-- SPØRGSMÅL CONTAINER -->
  <div id="dfs2-quiz-step-container">
    
    <div style="margin-bottom: 24px; min-height: 70px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
        <span id="dfs2-q-category" style="font-size: 0.72rem; font-weight: 800; color: #059669; text-transform: uppercase; letter-spacing: 0.5px;">
          Dimension
        </span>
        <span id="dfs2-q-desc" style="font-size: 0.72rem; color: #64748b; font-weight: 600;">
          Beskrivelse
        </span>
      </div>
      <h4 id="dfs2-q-text" style="margin: 0; font-size: 1.15rem; font-weight: 700; color: #0f172a; line-height: 1.4;">
        Spørgsmål indlæses...
      </h4>
    </div>

    <!-- FLOTTE SVARKNAPPER (5 MULIGHEDER) -->
    <div id="dfs2-options-container" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px;">
      <!-- Knapper genereres i JS -->
    </div>

    <!-- NAVIGATION KNAPPER -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 16px;">
      <button type="button" id="dfs2-prev-btn" style="background: transparent; border: 1px solid #cbd5e1; color: #64748b; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; visibility: hidden;">
        ← Forrige
      </button>
      <span style="font-size: 0.75rem; color: #94a3b8; font-weight: 600;">Vælg et svar for at gå videre</span>
    </div>

  </div>

  <!-- RESULTAT SEKTION (SKJULT INDTIL GENNEMFØRT) -->
  <div id="dfs2-results" style="display: none;">
    <div style="text-align: center; margin-bottom: 20px;">
      <span style="background: #dcfce7; color: #15803d; font-size: 0.75rem; font-weight: 800; padding: 6px 14px; border-radius: 20px;">🎉 Test Gennemført!</span>
      <h3 style="color: #0f172a; margin: 10px 0 0 0; font-size: 1.5rem;">Din Flow-Profil</h3>
    </div>

    <!-- HERO RESULTAT BOKS -->
    <div id="dfs2-hero-bg" style="background: linear-gradient(135deg, #047857 0%, #10b981 100%); color: #ffffff; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 24px; box-shadow: 0 8px 20px rgba(16,185,129,0.2);">
      <span style="font-size: 0.75rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; opacity: 0.9;">SAMLET FLOW INDEKS</span>
      <div style="font-size: 3.5rem; font-weight: 900; line-height: 1; margin: 8px 0;">
        <span id="dfs2-total-score">0</span><span style="font-size: 1.8rem;">%</span>
      </div>
      <p id="dfs2-total-desc" style="margin: 0; font-size: 0.85rem; opacity: 0.95; font-weight: 600; line-height: 1.4;"></p>
    </div>

    <!-- RADAR CHART GRAF -->
    <div style="position: relative; height: 350px; width: 100%; margin-bottom: 24px;">
      <canvas id="dfs2RadarChart"></canvas>
    </div>

    <!-- DETALJERET DELSKALA OVERSIGT -->
    <div id="dfs2-subscales-breakdown" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 24px;">
      <!-- Delskalaer indsættes her -->
    </div>

    <button type="button" id="dfs2-restart-btn" style="width: 100%; background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer;">
      🔄 Tag testen igen / Rediger svar
    </button>
  </div>

  <!-- KILDEANGIVELSE / FOOTER -->
  <div style="border-top: 1px solid #f1f5f9; margin-top: 24px; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #94a3b8; flex-wrap: wrap; gap: 8px;">
    <span>📌 <b>Kilde:</b> Jackson & Eklund (2002, 2004). <i>Dispositional Flow Scale-2 (DFS-2)</i>.</span>
    <span>&copy; motionsplan.dk</span>
  </div>

</div>

<script>
(function() {
  const STORAGE_KEY = 'motionsplan_dfs2_state';

  const dimensions = [
    {
      key: 'balance',
      name: 'Udfordring / Færdighed',
      desc: 'Mellem dine evner og opgavens krav',
      text: 'Mine personlige færdigheder matcher de høje krav og udfordringer i min sport.'
    },
    {
      key: 'merging',
      name: 'Handling & Bevidsthed',
      desc: 'Sammensmeltning af tanke og udførelse',
      text: 'Jeg udfører mine bevægelser automatisk og ubesværet uden at skulle tænke over dem.'
    },
    {
      key: 'goals',
      name: 'Klare Mål',
      desc: 'Tydelighed om næste handling',
      text: 'Jeg ved præcis, hvad jeg ønsker at opnå fra øjeblik til øjeblik i min sport.'
    },
    {
      key: 'feedback',
      name: 'Entydig Feedback',
      desc: 'Klar fornemmelse af succes',
      text: 'Jeg kan mærke eller se med det samme, om min præstation og mine handlinger lykkes.'
    },
    {
      key: 'concentration',
      name: 'Fuld Koncentration',
      desc: 'Fokus på den konkrete opgave',
      text: 'Jeg har min fulde opmærksomhed rettet mod opgaven og lader mig ikke forstyrre.'
    },
    {
      key: 'control',
      name: 'Følelse af Kontrol',
      desc: 'Mestring uden frygt for fejl',
      text: 'Jeg føler, at jeg har fuldstændig kontrol over mine handlinger og min krops præstation.'
    },
    {
      key: 'selfconscious',
      name: 'Ingen Selvkritik',
      desc: 'Tab af selvbevidsthed',
      text: 'Jeg bekymrer mig overhovedet ikke om, hvad andre tænker om mig eller min præstation.'
    },
    {
      key: 'time',
      name: 'Tidsforvrængning',
      desc: 'Særlig oplevelse af tidens gang',
      text: 'Tiden føles som om den ændrer sig – minutter flyver afsted, eller alt føles som slowmotion.'
    },
    {
      key: 'autotelic',
      name: 'Indre Glæde & Belønning',
      desc: 'Autotelisk oplevelse',
      text: 'Oplevelsen i sig selv giver mig en dyb indre glæde, uanset det endelige resultat.'
    }
  ];

  const options = [
    { val: 1, label: "Sjældent" },
    { val: 2, label: "En gang imellem" },
    { val: 3, label: "Nogle gange" },
    { val: 4, label: "Ofte" },
    { val: 5, label: "Næsten altid" }
  ];

  let currentStep = 0;
  let userAnswers = {};
  let chartInstance = null;

  function loadSaved() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        userAnswers = JSON.parse(saved);
      } catch(e) {}
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(userAnswers));
  }

  function renderStep() {
    const dim = dimensions[currentStep];
    const totalQ = dimensions.length;
    const pct = Math.round(((currentStep + 1) / totalQ) * 100);

    // Opdater Header & Progress
    document.getElementById('dfs2-step-counter').textContent = `Spørgsmål ${currentStep + 1} af ${totalQ}`;
    document.getElementById('dfs2-step-pct').textContent = `${pct}% færdig`;
    document.getElementById('dfs2-progress-bar').style.width = `${pct}%`;

    // Opdater Spørgsmål Tekst
    document.getElementById('dfs2-q-category').textContent = dim.name;
    document.getElementById('dfs2-q-desc').textContent = dim.desc;
    document.getElementById('dfs2-q-text').textContent = `${currentStep + 1}. "${dim.text}"`;

    // Vis/skjul "Forrige" knap
    const prevBtn = document.getElementById('dfs2-prev-btn');
    prevBtn.style.visibility = currentStep > 0 ? 'visible' : 'hidden';

    // Render Flotte Svarknapper
    const optionsContainer = document.getElementById('dfs2-options-container');
    optionsContainer.innerHTML = '';

    const selectedVal = userAnswers[dim.key] !== undefined ? parseInt(userAnswers[dim.key]) : null;

    options.forEach(opt => {
      const isSelected = selectedVal === opt.val;
      const btn = document.createElement('button');
      btn.type = 'button';
      
      btn.style.cssText = `
        width: 100%;
        padding: 13px 18px;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 700;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: ${isSelected ? '2px solid #059669' : '1px solid #cbd5e1'};
        background: ${isSelected ? '#ecfdf5' : '#ffffff'};
        color: ${isSelected ? '#065f46' : '#334155'};
        box-shadow: ${isSelected ? '0 4px 12px rgba(5, 150, 105, 0.15)' : '0 2px 4px rgba(0,0,0,0.02)'};
      `;

      btn.innerHTML = `
        <span>${opt.label}</span>
        <span style="width: 20px; height: 20px; border-radius: 50%; border: ${isSelected ? '6px solid #059669' : '2px solid #cbd5e1'}; background: #ffffff;"></span>
      `;

      btn.addEventListener('click', function() {
        userAnswers[dim.key] = opt.val;
        saveState();

        setTimeout(() => {
          if (currentStep < totalQ - 1) {
            currentStep++;
            renderStep();
          } else {
            calculateAndShowResults();
          }
        }, 150);
      });

      optionsContainer.appendChild(btn);
    });
  }

  function calculateAndShowResults() {
    let sum = 0;
    dimensions.forEach(dim => {
      const val = parseInt(userAnswers[dim.key] || '3');
      sum += val;
    });

    const totalPct = Math.round((sum / 45) * 100);

    // Skjul Wizard UI & Vis Resultater
    document.getElementById('dfs2-wizard-header').style.display = 'none';
    document.getElementById('dfs2-quiz-step-container').style.display = 'none';
    
    const resultsDiv = document.getElementById('dfs2-results');
    resultsDiv.style.display = 'block';

    document.getElementById('dfs2-total-score').textContent = totalPct;

    const descEl = document.getElementById('dfs2-total-desc');
    const heroBg = document.getElementById('dfs2-hero-bg');

    if (totalPct >= 80) {
      heroBg.style.background = 'linear-gradient(135deg, #047857 0%, #10b981 100%)';
      descEl.textContent = "Høj tilbøjelighed til Flow! Du har et fremragende fundament for regelmæssigt at opnå optimal præstation og dyb idrætsglæde.";
    } else if (totalPct >= 60) {
      heroBg.style.background = 'linear-gradient(135deg, #d97706 0%, #f59e0b 100%)';
      descEl.textContent = "Moderat Flow-tilbøjelighed. Du oplever zonen med jævne mellemrum, men har udvalgte dimensioner, der med fordel kan styrkes.";
    } else {
      heroBg.style.background = 'linear-gradient(135deg, #dc2626 0%, #ef4444 100%)';
      descEl.textContent = "Lavere Flow-frekvens. Målrettet arbejde med klare delmål, fokus og udfordringsbalancen kan åbne op for flere flow-oplevelser.";
    }

    // Render Delskala Kort
    const breakdown = document.getElementById('dfs2-subscales-breakdown');
    breakdown.innerHTML = '';

    dimensions.forEach(dim => {
      const val = parseInt(userAnswers[dim.key] || '3'); // 1-5
      const dimPct = Math.round((val / 5) * 100);

      let badgeColor = '#10b981';
      if (val <= 2) badgeColor = '#ef4444';
      else if (val <= 3) badgeColor = '#f59e0b';

      const item = document.createElement('div');
      item.style.cssText = "background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px;";
      item.innerHTML = `
        <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 0.8rem; color: #334155; margin-bottom: 6px;">
          <span>${dim.name}</span>
          <span style="color: ${badgeColor}; font-weight: 800;">${val} / 5</span>
        </div>
        <div style="width: 100%; background: #e2e8f0; height: 6px; border-radius: 3px; overflow: hidden;">
          <div style="width: ${dimPct}%; background: ${badgeColor}; height: 100%;"></div>
        </div>
      `;
      breakdown.appendChild(item);
    });

    renderRadarChart();
    resultsDiv.scrollIntoView({ behavior: 'smooth' });
  }

  function renderRadarChart() {
    const ctx = document.getElementById('dfs2RadarChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: dimensions.map(d => d.name),
        datasets: [{
          label: 'Dine Flow-Dimensioner (1-5)',
          data: dimensions.map(d => parseInt(userAnswers[d.key] || '3')),
          backgroundColor: 'rgba(16, 185, 129, 0.2)',
          borderColor: '#10b981',
          borderWidth: 2,
          pointBackgroundColor: '#10b981'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          r: {
            min: 1,
            max: 5,
            ticks: { stepSize: 1 }
          }
        }
      }
    });
  }

  // Event Listeners
  document.getElementById('dfs2-prev-btn').addEventListener('click', function() {
    if (currentStep > 0) {
      currentStep--;
      renderStep();
    }
  });

  document.getElementById('dfs2-restart-btn').addEventListener('click', function() {
    document.getElementById('dfs2-wizard-header').style.display = 'block';
    document.getElementById('dfs2-quiz-step-container').style.display = 'block';
    document.getElementById('dfs2-results').style.display = 'none';
    currentStep = 0;
    renderStep();
  });

  // Start Op
  loadSaved();
  
  if (Object.keys(userAnswers).length >= dimensions.length) {
    calculateAndShowResults();
  } else {
    for (let i = 0; i < dimensions.length; i++) {
      if (userAnswers[dimensions[i].key] === undefined) {
        currentStep = i;
        break;
      }
    }
    renderStep();
  }
})();
</script>
