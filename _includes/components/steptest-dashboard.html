<div class="mp-db-wrapper">
  
  <!-- TOPBAR -->
  <div class="mp-db-topbar">
    <div>
      <div class="mp-db-title">📊 Dine Steptest Resultater & Oversigt</div>
      <p class="mp-db-subtitle">Samlet overblik over dine gennemførte steptests, beregnede kondital og fitness-indeks.</p>
    </div>
    <div class="mp-db-actions">
      <button type="button" class="mp-db-btn-primary js-db-add-btn">
        ➕ Tilføj Test
      </button>
      <button type="button" class="mp-db-btn-outline js-db-reset-btn">
        🔄 Nulstil
      </button>
    </div>
  </div>

  <!-- GRID -->
  <div class="mp-db-grid js-db-grid">
    <!-- Genereres dynamisk af DashboardManager -->
  </div>

  <!-- MODAL TIL TILFØJELSE AF TESTS -->
  <div class="js-db-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6); z-index: 1000; align-items: center; justify-content: center; padding: 16px;">
    <div style="background: #ffffff; border-radius: 16px; max-width: 580px; width: 100%; height: 520px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);">
      
      <div style="padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; flex-shrink: 0;">
        <div style="font-size: 1.05rem; font-weight: 800; color: #0f172a;">Vælg steptest til dashboard</div>
        <button type="button" class="js-modal-close" style="background: #f1f5f9; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 0.85rem;">✖</button>
      </div>

      <div style="display: flex; gap: 6px; padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; overflow-x: auto; flex-shrink: 0;">
        <button type="button" class="js-modal-tab" data-category="all" style="background: #ffffff; border: none; padding: 5px 12px; font-size: 0.78rem; font-weight: 700; color: #0f172a; border-radius: 6px; cursor: pointer;">Alle</button>
        <button type="button" class="js-modal-tab" data-category="Submaksimal" style="background: transparent; border: none; padding: 5px 12px; font-size: 0.78rem; font-weight: 700; color: #64748b; border-radius: 6px; cursor: pointer;">Submaksimal</button>
        <button type="button" class="js-modal-tab" data-category="Progressiv" style="background: transparent; border: none; padding: 5px 12px; font-size: 0.78rem; font-weight: 700; color: #64748b; border-radius: 6px; cursor: pointer;">Progressiv</button>
        <button type="button" class="js-modal-tab" data-category="Udholdenhed" style="background: transparent; border: none; padding: 5px 12px; font-size: 0.78rem; font-weight: 700; color: #64748b; border-radius: 6px; cursor: pointer;">Udholdenhed</button>
      </div>

      <div class="js-modal-test-list" style="padding: 16px 20px; overflow-y: auto; flex: 1;">
        <!-- Genereres dynamisk -->
      </div>

    </div>
  </div>

</div>

<script type="module">
import { DashboardManager } from '/assets/js/core/DashboardManager.js';

const STEPTEST_LIBRARY = {
  'ymca': { title: 'YMCA 3-Minutters Steptest', tag: '🪜 Steptest', category: 'Submaksimal', unit: 'ml/kg/min', url: '/ymca-3-minutters-steptest/', desc: 'Enkel 3-minutters test på 30 cm boks med talte 1-minuts puls efter testen.', storageKey: 'ymca_step', allowQuickLog: true },
  'ymca_modified': { title: 'YMCA Modified Steptest', tag: '🪜 Steptest', category: 'Submaksimal', unit: 'ml/kg/min', url: '/ymca-modified-steptest/', desc: 'Tilpasset 3-minutters test, hvor bokshøjden udregnes ud fra kropshøjde.', storageKey: 'ymca_modified_step', allowQuickLog: true },
  'dansk': { title: 'Den Danske Steptest', tag: '🪜 Steptest', category: 'Progressiv', unit: 'ml/kg/min', url: '/den-danske-steptest/', desc: 'Progressiv test uden pulsmåling, udregnet fra gennemført tid og bokshøjde.', storageKey: 'dansk_steptest', allowQuickLog: true },
  'queens': { title: 'Queens College Step Test', tag: '🪜 Steptest', category: 'Submaksimal', unit: 'ml/kg/min', url: '/queens-college-step-test/', desc: 'Standardiseret 3-minutters test på 41,3 cm bænk med opdelt kadence for køn.', storageKey: 'queens_step', allowQuickLog: true },
  'chester': { title: 'Chester Step Test', tag: '🪜 Steptest', category: 'Progressiv', unit: 'ml/kg/min', url: '/chester-step-test/', desc: 'Progressiv test over op til 5 niveauer med øgende tempo tilpasset alder.', storageKey: 'chester_step', allowQuickLog: false },
  'astrand': { title: 'Åstrand-Ryhming Step Test', tag: '🪜 Steptest', category: 'Submaksimal', unit: 'ml/kg/min', url: '/astrand-ryhming-step-test/', desc: 'Klassisk 6-minutters fysiologisk test med fast kadence og steady-state puls.', storageKey: 'astrand_step', allowQuickLog: true },
  'harvard': { title: 'Harvard Step Test', tag: '🪜 Steptest', category: 'Udholdenhed', unit: 'ml/kg/min', url: '/harvard-step-test/', desc: 'Intensiv udholdenhedstest på høj bænk. Beregner både VO₂max og Fitness Index.', storageKey: 'harvard_step', allowQuickLog: true }
};

function init() {
  DashboardManager.initGrid({
    gridSelector: '.js-db-grid',
    library: STEPTEST_LIBRARY,
    defaultCards: ['ymca', 'ymca_modified', 'dansk', 'queens', 'chester', 'astrand', 'harvard'],
    configStorageKey: 'mp_steptest_dashboard_cards',
    resetBtnSelector: '.js-db-reset-btn',
    addBtnSelector: '.js-db-add-btn',
    modalSelector: '.js-db-modal',
    showTag: false
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
