<script>
(function() {
  // Web Audio API Beep Generator
  let audioCtx = null;
  let soundEnabled = true;

  function playBeep(freq = 880, duration = 0.15, type = 'sine') {
    if (!soundEnabled) return;
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) { console.log(e); }
  }

  // Timer Engine State
  let queue = [];
  let currentIndex = 0;
  let timeRemainingInStep = 0;
  let totalDuration = 0;
  let totalElapsed = 0;
  let timerInterval = null;
  let isRunning = false;

  // DOM Elements
  const container = document.getElementById('interval-timer-container');
  const elTime = document.getElementById('timer-time');
  const elPhaseTitle = document.getElementById('timer-phase-title');
  const elPhaseNote = document.getElementById('timer-phase-note');
  const elElapsed = document.getElementById('stat-elapsed');
  const elInterval = document.getElementById('stat-interval');
  const elSeries = document.getElementById('stat-series');
  const elRemaining = document.getElementById('stat-remaining');
  const elVisualizer = document.getElementById('timer-visualizer');
  const elProgressBar = document.getElementById('timer-progress-bar');
  const btnPlay = document.getElementById('btn-play');
  const btnReset = document.getElementById('btn-reset');
  const btnSound = document.getElementById('btn-sound');
  const btnFullscreen = document.getElementById('btn-fullscreen');
  const iconFsEnter = document.getElementById('icon-fs-enter');
  const iconFsExit = document.getElementById('icon-fs-exit');
  const btnSettingsToggle = document.getElementById('btn-settings-toggle');
  const presetBadge = document.getElementById('timer-preset-badge');
  const presetBadgeText = document.getElementById('preset-badge-text');
  const settingsPanel = document.getElementById('timer-settings-panel');
  const btnSaveSettings = document.getElementById('btn-save-settings');
  const presetSelect = document.getElementById('preset-select');
  const customFields = document.getElementById('custom-fields');
  const box102030Info = document.getElementById('box-10-20-30-info');

  // Format Helpers
  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }

  // Fullscreen Logic
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || container.classList.contains('timer-fullscreen-fallback'));
  }

  function toggleFullscreen() {
    if (!isFullscreen()) {
      if (container.requestFullscreen) {
        container.requestFullscreen().catch(() => container.classList.add('timer-fullscreen-fallback'));
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      } else {
        container.classList.add('timer-fullscreen-fallback');
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
      container.classList.remove('timer-fullscreen-fallback');
    }
  }

  // Render Visual Bar Graph
  function renderVisualizer() {
    elVisualizer.innerHTML = '';
    queue.forEach((step) => {
      const bar = document.createElement('div');
      bar.className = `viz-bar viz-${step.stateClass}`;
      bar.title = `${step.title}: ${step.duration}s`;
      elVisualizer.appendChild(bar);
    });
  }

  // Map Preset Value to Display Name
  function updatePresetBadgeName(val) {
    const names = {
      'tabata': 'Ægte Tabata',
      '10-20-30': '10-20-30 Løb',
      'billat': 'Billat 30/30',
      '15-15': '15/15 Intervaller',
      '30-30': '30/30 Intervaller',
      '4x4': '4x4 Norsk Tærskel',
      'sprint8': 'Sprint 8 SIT',
      'custom': 'Brugerdefineret'
    };
    presetBadgeText.innerText = names[val] || 'Intervaltimer';
  }

  // Preset Configurations Generator
  function buildQueueFromSettings() {
    const preset = presetSelect.value;
    updatePresetBadgeName(preset);
    queue = [];

    if (preset === '10-20-30') {
      const prep = 10;
      const repsPerSeries = parseInt(document.getElementById('cfg-102030-reps').value) || 5;
      const seriesCount = parseInt(document.getElementById('cfg-102030-series').value) || 3;
      const seriesRest = parseInt(document.getElementById('cfg-102030-series-rest').value) || 120;

      if (prep > 0) {
        queue.push({ title: 'KLARGØRING', note: 'Gør dig klar til løb...', duration: prep, stateClass: 'timer-state-prep', rep: 0, totalReps: repsPerSeries, series: 1, totalSeries: seriesCount });
      }

      for (let s = 1; s <= seriesCount; s++) {
        for (let r = 1; r <= repsPerSeries; r++) {
          queue.push({ title: '10-20-30: ROLIGT', note: 'Gå eller let jog (30 sek)', duration: 30, stateClass: 'timer-state-work-low', rep: r, totalReps: repsPerSeries, series: s, totalSeries: seriesCount });
          queue.push({ title: '10-20-30: MODERAT', note: 'Almindeligt løbetempo (20 sek)', duration: 20, stateClass: 'timer-state-work-med', rep: r, totalReps: repsPerSeries, series: s, totalSeries: seriesCount });
          queue.push({ title: '10-20-30: SPURT!', note: 'SPURT 100% ALL-OUT! (10 sek)', duration: 10, stateClass: 'timer-state-work', rep: r, totalReps: repsPerSeries, series: s, totalSeries: seriesCount });
        }
        if (s < seriesCount && seriesRest > 0) {
          queue.push({ title: 'SERIEPAUSE', note: 'Gå roligt og få pulsen ned', duration: seriesRest, stateClass: 'timer-state-series-rest', rep: repsPerSeries, totalReps: repsPerSeries, series: s, totalSeries: seriesCount });
        }
      }
    } else {
      let prep = parseInt(document.getElementById('cfg-prep').value) || 0;
      let work = parseInt(document.getElementById('cfg-work').value) || 20;
      let rest = parseInt(document.getElementById('cfg-rest').value) || 10;
      let reps = parseInt(document.getElementById('cfg-reps').value) || 8;
      let series = parseInt(document.getElementById('cfg-series').value) || 1;
      let seriesRest = parseInt(document.getElementById('cfg-series-rest').value) || 120;
      let noteWork = document.getElementById('cfg-note-work').value;
      let noteRest = document.getElementById('cfg-note-rest').value;

      if (prep > 0) {
        queue.push({ title: 'KLARGØRING', note: 'Gør dig klar...', duration: prep, stateClass: 'timer-state-prep', rep: 0, totalReps: reps, series: 1, totalSeries: series });
      }

      for (let s = 1; s <= series; s++) {
        for (let r = 1; r <= reps; r++) {
          queue.push({ title: 'ARBEJDE', note: noteWork, duration: work, stateClass: 'timer-state-work', rep: r, totalReps: reps, series: s, totalSeries: series });
          if (r < reps && rest > 0) {
            queue.push({ title: 'INTERVALPAUSE', note: noteRest, duration: rest, stateClass: 'timer-state-rest', rep: r, totalReps: reps, series: s, totalSeries: series });
          }
        }
        if (s < series && seriesRest > 0) {
          queue.push({ title: 'SERIEPAUSE', note: 'Pause mellem sæt/serier', duration: seriesRest, stateClass: 'timer-state-series-rest', rep: reps, totalReps: reps, series: s, totalSeries: series });
        }
      }
    }

    totalDuration = queue.reduce((acc, step) => acc + step.duration, 0);
    renderVisualizer();
    resetTimerState();
  }

  function resetTimerState() {
    clearInterval(timerInterval);
    isRunning = false;
    currentIndex = 0;
    totalElapsed = 0;
    btnPlay.innerText = 'START';
    if (queue.length > 0) {
      timeRemainingInStep = queue[0].duration;
      updateUI();
    }
  }

  function updateUI() {
    const bars = elVisualizer.querySelectorAll('.viz-bar');

    if (queue.length === 0 || currentIndex >= queue.length) {
      container.className = 'timer-state-done';
      elPhaseTitle.innerText = 'TRÆNING FÆRDIG!';
      elPhaseNote.innerText = 'Stærkt arbejdet!';
      elTime.innerText = '00:00';
      elRemaining.innerText = '00:00';
      elElapsed.innerText = formatTime(totalDuration);
      elProgressBar.style.width = '100%';
      
      bars.forEach(b => {
        b.classList.remove('active');
        b.classList.add('completed');
      });
      return;
    }

    const currentStep = queue[currentIndex];
    container.className = currentStep.stateClass;
    elPhaseTitle.innerText = currentStep.title;
    elPhaseNote.innerText = currentStep.note;
    elTime.innerText = formatTime(timeRemainingInStep);
    
    elElapsed.innerText = formatTime(totalElapsed);
    elInterval.innerText = `${currentStep.rep} / ${currentStep.totalReps}`;
    elSeries.innerText = `${currentStep.series} / ${currentStep.totalSeries}`;
    
    const remainingTotal = totalDuration - totalElapsed;
    elRemaining.innerText = formatTime(remainingTotal > 0 ? remainingTotal : 0);

    const stepProgress = ((currentStep.duration - timeRemainingInStep) / currentStep.duration) * 100;
    elProgressBar.style.width = `${stepProgress}%`;

    bars.forEach((bar, idx) => {
      bar.classList.remove('active', 'completed');
      if (idx < currentIndex) {
        bar.classList.add('completed');
      } else if (idx === currentIndex) {
        bar.classList.add('active');
        const scrollPos = bar.offsetLeft - (elVisualizer.clientWidth / 2) + (bar.clientWidth / 2);
        elVisualizer.scrollTo({ left: scrollPos, behavior: 'smooth' });
      }
    });
  }

  function tick() {
    timeRemainingInStep--;
    totalElapsed++;

    if (timeRemainingInStep <= 0) {
      currentIndex++;
      if (currentIndex < queue.length) {
        timeRemainingInStep = queue[currentIndex].duration;
        playBeep(1200, 0.3);
      } else {
        clearInterval(timerInterval);
        isRunning = false;
        btnPlay.innerText = 'START';
      }
    } else if (timeRemainingInStep <= 3) {
      playBeep(600, 0.1);
    }

    updateUI();
  }

  // Event Listeners
  btnPlay.addEventListener('click', () => {
    if (currentIndex >= queue.length) {
      resetTimerState();
    }

    if (!isRunning) {
      isRunning = true;
      btnPlay.innerText = 'PAUSE';
      timerInterval = setInterval(tick, 1000);
      playBeep(880, 0.15);
    } else {
      isRunning = false;
      btnPlay.innerText = 'START';
      clearInterval(timerInterval);
    }
  });

  btnReset.addEventListener('click', resetTimerState);

  btnSound.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    btnSound.style.opacity = soundEnabled ? '1' : '0.4';
  });

  btnFullscreen.addEventListener('click', toggleFullscreen);

  ['fullscreenchange', 'webkitfullscreenchange'].forEach(evt => {
    document.addEventListener(evt, () => {
      const fs = isFullscreen();
      iconFsEnter.style.display = fs ? 'none' : 'block';
      iconFsExit.style.display = fs ? 'block' : 'none';
      if (!fs) container.classList.remove('timer-fullscreen-fallback');
    });
  });

  // Open Settings via gear OR top preset badge
  btnSettingsToggle.addEventListener('click', () => {
    settingsPanel.classList.toggle('settings-hidden');
  });

  presetBadge.addEventListener('click', () => {
    settingsPanel.classList.toggle('settings-hidden');
  });

  presetSelect.addEventListener('change', (e) => {
    const val = e.target.value;
    
    if (val === '10-20-30') {
      customFields.style.display = 'none';
      box102030Info.style.display = 'block';
    } else {
      box102030Info.style.display = 'none';
      customFields.style.display = 'block';

      if (val === 'tabata') {
        document.getElementById('cfg-prep').value = 10;
        document.getElementById('cfg-work').value = 20;
        document.getElementById('cfg-rest').value = 10;
        document.getElementById('cfg-reps').value = 8;
        document.getElementById('cfg-series').value = 1;
        document.getElementById('cfg-series-rest').value = 120;
        document.getElementById('cfg-note-work').value = 'ALL-OUT MAP! Fuld fart.';
        document.getElementById('cfg-note-rest').value = 'Pust ud og gør klar.';
      } else if (val === 'billat') {
        document.getElementById('cfg-prep').value = 10;
        document.getElementById('cfg-work').value = 30;
        document.getElementById('cfg-rest').value = 30;
        document.getElementById('cfg-reps').value = 15;
        document.getElementById('cfg-series').value = 1;
        document.getElementById('cfg-series-rest').value = 120;
        document.getElementById('cfg-note-work').value = 'vVO2max tempo (100%)';
        document.getElementById('cfg-note-rest').value = 'Aktiv jog (50% vVO2max)';
      } else if (val === '15-15') {
        document.getElementById('cfg-prep').value = 10;
        document.getElementById('cfg-work').value = 15;
        document.getElementById('cfg-rest').value = 15;
        document.getElementById('cfg-reps').value = 10;
        document.getElementById('cfg-series').value = 2;
        document.getElementById('cfg-series-rest').value = 120;
        document.getElementById('cfg-note-work').value = 'Høj intensitet';
        document.getElementById('cfg-note-rest').value = 'Aktiv pause';
      } else if (val === '30-30') {
        document.getElementById('cfg-prep').value = 10;
        document.getElementById('cfg-work').value = 30;
        document.getElementById('cfg-rest').value = 30;
        document.getElementById('cfg-reps').value = 10;
        document.getElementById('cfg-series').value = 1;
        document.getElementById('cfg-note-work').value = 'Kontrolleret højt tempo';
        document.getElementById('cfg-note-rest').value = 'Gå / jog roligt';
      } else if (val === '4x4') {
        document.getElementById('cfg-prep').value = 15;
        document.getElementById('cfg-work').value = 240;
        document.getElementById('cfg-rest').value = 180;
        document.getElementById('cfg-reps').value = 4;
        document.getElementById('cfg-series').value = 1;
        document.getElementById('cfg-note-work').value = '85-95% af makspuls (Tung vejrtrækning)';
        document.getElementById('cfg-note-rest').value = 'Aktiv jog (~70% makspuls)';
      } else if (val === 'sprint8') {
        document.getElementById('cfg-prep').value = 15;
        document.getElementById('cfg-work').value = 30;
        document.getElementById('cfg-rest').value = 90;
        document.getElementById('cfg-reps').value = 8;
        document.getElementById('cfg-series').value = 1;
        document.getElementById('cfg-note-work').value = '100% Supramaksimal Sprint!';
        document.getElementById('cfg-note-rest').value = 'Rolig gang / let pedaltræden';
      }
    }

    buildQueueFromSettings();
  });

  btnSaveSettings.addEventListener('click', () => {
    buildQueueFromSettings();
    settingsPanel.classList.add('settings-hidden');
  });

  // Skift automatisk til 'custom' hvis brugeren retter i de manuelle inputfelter
  ['cfg-prep', 'cfg-work', 'cfg-rest', 'cfg-reps', 'cfg-series', 'cfg-series-rest', 'cfg-note-work', 'cfg-note-rest'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('input', () => {
        presetSelect.value = 'custom';
      });
    }
  });

  presetSelect.dispatchEvent(new Event('change'));
})();
</script>
