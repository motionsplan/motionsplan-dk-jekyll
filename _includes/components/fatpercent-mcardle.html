<div class="mcardle-calc-card" id="mcardle-calculator">
  
  <!-- HEADER -->
  <div class="mcardle-calc-header">
    <div class="mcardle-calc-title-group">
      <span class="mcardle-calc-icon">📐</span>
      <div>
        <h3 class="mcardle-calc-title">McArdle & Katch Beregner</h3>
        <p class="mcardle-calc-subtitle">Alders- og kønsspecifik omkredsmåling med målebånd</p>
      </div>
    </div>
    <div class="mcardle-calc-avatar">🦵</div>
  </div>

  <!-- KØNSVÆLGER (TOGGLE) -->
  <div class="mcardle-calc-section">
    <label class="mcardle-input-label">Køn</label>
    <div class="mcardle-gender-toggle">
      <button type="button" class="mcardle-gender-btn active" data-gender="male" id="mcardle-btn-male">
        <span>👨 Male / Mand</span>
      </button>
      <button type="button" class="mcardle-gender-btn" data-gender="female" id="mcardle-btn-female">
        <span>👩 Female / Kvinde</span>
      </button>
    </div>
  </div>

  <!-- BASIS DATA (ALDER, HØJDE & VÆGT) -->
  <div class="mcardle-input-grid-top">
    <div class="mcardle-input-group">
      <label for="mcardle-age">🎂 Alder <span class="mcardle-unit">(år)</span></label>
      <input type="number" id="mcardle-age" placeholder="fx 25" value="" min="10" max="100">
    </div>
    <div class="mcardle-input-group">
      <label for="mcardle-height">📏 Højde <span class="mcardle-unit">(cm)</span></label>
      <input type="number" id="mcardle-height" placeholder="fx 180" value="" min="100" max="250" step="0.5">
    </div>
    <div class="mcardle-input-group">
      <label for="mcardle-weight">⚖️ Vægt <span class="mcardle-unit">(kg)</span></label>
      <input type="number" id="mcardle-weight" placeholder="fx 80" value="" min="30" max="250" step="0.1">
    </div>
  </div>

  <!-- SIDE-BY-SIDE SEKTION: VENSTRE = MAKSIMAL FIGUR, HØJRE = MÅLINGER -->
  <div class="mcardle-main-section">
    
    <!-- VENSTRE SIDE: BILLEDE MED BADGE OVERLAY -->
    <div class="mcardle-left-col">
      <div class="mcardle-diagram-wrapper">
        <img id="mcardle-diagram-img" src="/assets/images/tools/mcardle-male-younger.jpg" alt="McArdle Målesteder Illustration">
      </div>
      <div class="mcardle-category-banner">
        <span class="mcardle-badge" id="mcardle-cat-badge">Mand (< 27 år)</span>
      </div>
    </div>

    <!-- HØJRE SIDE: DE 3 DYNAMISKE MÅLE-INPUTS -->
    <div class="mcardle-right-col">
      <label class="mcardle-input-label">🎯 Indtast 3 omkredse (cm)</label>
      
      <div class="mcardle-measurements-stack">
        
        <!-- MÅLING 1 -->
        <div class="mcardle-measure-card">
          <div class="mcardle-measure-text">
            <span class="mcardle-measure-name" id="mcardle-label-1">Overarm</span>
            <span class="mcardle-measure-sub" id="mcardle-sub-1">(Upper arm)</span>
          </div>
          <div class="mcardle-input-wrap">
            <input type="number" id="mcardle-input-1" value="" step="0.5" min="10" max="150">
            <span class="mcardle-unit-tag">cm</span>
          </div>
        </div>

        <!-- MÅLING 2 -->
        <div class="mcardle-measure-card">
          <div class="mcardle-measure-text">
            <span class="mcardle-measure-name" id="mcardle-label-2">Underarm</span>
            <span class="mcardle-measure-sub" id="mcardle-sub-2">(Forearm)</span>
          </div>
          <div class="mcardle-input-wrap">
            <input type="number" id="mcardle-input-2" value="" step="0.5" min="10" max="150">
            <span class="mcardle-unit-tag">cm</span>
          </div>
        </div>

        <!-- MÅLING 3 -->
        <div class="mcardle-measure-card">
          <div class="mcardle-measure-text">
            <span class="mcardle-measure-name" id="mcardle-label-3">Talje</span>
            <span class="mcardle-measure-sub" id="mcardle-sub-3">(Waist)</span>
          </div>
          <div class="mcardle-input-wrap">
            <input type="number" id="mcardle-input-3" value="" step="0.5" min="20" max="200">
            <span class="mcardle-unit-tag">cm</span>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- RESULTAT SEKTION -->
  <div class="mcardle-results-container">
    <div class="mcardle-result-main">
      <span class="mcardle-res-label">ESTIMERET FEDTPROCENT</span>
      <div class="mcardle-res-number-wrap">
        <span class="mcardle-res-big" id="mcardle-res-fatpct">0.0</span>
        <span class="mcardle-res-percent">%</span>
      </div>
      <span class="mcardle-res-method">McArdle & Katch Formlen (SD: ±3.5%)</span>
    </div>

    <div class="mcardle-result-side">
      <div class="mcardle-side-box">
        <span class="mcardle-side-label">Fedtmasse</span>
        <span class="mcardle-side-val" id="mcardle-res-fatmass">0.0 <small>kg</small></span>
      </div>
      <div class="mcardle-side-box">
        <span class="mcardle-side-label">Fedtfri masse</span>
        <span class="mcardle-side-val" id="mcardle-res-leanmass">0.0 <small>kg</small></span>
      </div>
    </div>
  </div>

  <!-- HANDLINGS-KNAPPER -->
  <div class="mcardle-actions">
    <button type="button" class="mcardle-btn-primary" id="mcardle-btn-capture">
      📸 Tag billede / Gem
    </button>
    <button type="button" class="mcardle-btn-reset" id="mcardle-btn-reset" title="Nulstil felt">
      🗑️
    </button>
  </div>

  <!-- WATERMARK / BRANDING -->
  <div class="mcardle-calc-footer">
    © motionsplan.dk
  </div>

</div>

<!-- CSS STYLES -->

<script type="module">
  import { StorageAdapter } from '/assets/js/core/StorageAdapter.js';

  document.addEventListener("DOMContentLoaded", function() {
    const calc = document.getElementById("mcardle-calculator");
    if (!calc) return;

    const TEST_ID = 'fatpct_mcardle';

    // DOM Elementer
    const btnMale = calc.querySelector("#mcardle-btn-male");
    const btnFemale = calc.querySelector("#mcardle-btn-female");
    
    const inputAge = calc.querySelector("#mcardle-age");
    const inputHeight = calc.querySelector("#mcardle-height");
    const inputWeight = calc.querySelector("#mcardle-weight");

    const catBadge = calc.querySelector("#mcardle-cat-badge");
    const diagramImg = calc.querySelector("#mcardle-diagram-img");

    const label1 = calc.querySelector("#mcardle-label-1");
    const sub1 = calc.querySelector("#mcardle-sub-1");
    const input1 = calc.querySelector("#mcardle-input-1");

    const label2 = calc.querySelector("#mcardle-label-2");
    const sub2 = calc.querySelector("#mcardle-sub-2");
    const input2 = calc.querySelector("#mcardle-input-2");

    const label3 = calc.querySelector("#mcardle-label-3");
    const sub3 = calc.querySelector("#mcardle-sub-3");
    const input3 = calc.querySelector("#mcardle-input-3");

    const resFatPct = calc.querySelector("#mcardle-res-fatpct");
    const resFatMass = calc.querySelector("#mcardle-res-fatmass");
    const resLeanMass = calc.querySelector("#mcardle-res-leanmass");

    const btnReset = calc.querySelector("#mcardle-btn-reset");
    const btnCapture = calc.querySelector("#mcardle-btn-capture");

    let gender = "male";

    // Tilstand pr. kropsdel (starter tomme – ingen demotal)
    const bodyPartValues = {
      overarm: '',
      underarm: '',
      talje: '',
      hofte: '',
      laar: '',
      laeg: ''
    };

    const diagramPaths = {
      m_young: "/assets/images/tools/mcardle-male-younger.jpg",
      m_old: "/assets/images/tools/mcardle-male-older.jpg",
      f_young: "/assets/images/tools/mcardle-female-younger.jpg",
      f_old: "/assets/images/tools/mcardle-female-older.jpg"
    };

    const categories = {
      m_young: {
        badge: "Mand (< 27 år)",
        img: diagramPaths.m_young,
        parts: [
          { id: "overarm", label: "Overarm", sub: "(Upper arm)" },
          { id: "underarm", label: "Underarm", sub: "(Forearm)" },
          { id: "talje", label: "Talje", sub: "(Waist)" }
        ]
      },
      m_old: {
        badge: "Mand (27+ år)",
        img: diagramPaths.m_old,
        parts: [
          { id: "underarm", label: "Underarm", sub: "(Forearm)" },
          { id: "talje", label: "Talje", sub: "(Waist)" },
          { id: "hofte", label: "Hofte", sub: "(Hips)" }
        ]
      },
      f_young: {
        badge: "Kvinde (< 27 år)",
        img: diagramPaths.f_young,
        parts: [
          { id: "underarm", label: "Underarm", sub: "(Forearm)" },
          { id: "talje", label: "Talje", sub: "(Waist)" },
          { id: "laar", label: "Lår", sub: "(Thigh)" }
        ]
      },
      f_old: {
        badge: "Kvinde (27+ år)",
        img: diagramPaths.f_old,
        parts: [
          { id: "talje", label: "Talje", sub: "(Waist)" },
          { id: "laar", label: "Lår", sub: "(Thigh)" },
          { id: "laeg", label: "Læg", sub: "(Calf)" }
        ]
      }
    };

    function getCurrentCategoryKey() {
      const age = parseInt(inputAge.value, 10) || 25;
      const isYoung = age < 27;
      return gender === "male" ? (isYoung ? "m_young" : "m_old") : (isYoung ? "f_young" : "f_old");
    }

    // --- STORAGE INTEGRATION: INDLÆS GEMTE DATA ---
    function loadSavedData() {
      try {
        if (typeof StorageAdapter !== 'undefined' && StorageAdapter.getProfile) {
          const profile = StorageAdapter.getProfile();
          if (profile) {
            if (profile.age) inputAge.value = profile.age;
            if (profile.height) inputHeight.value = profile.height;
            if (profile.weight) inputWeight.value = profile.weight;
            if (profile.gender) gender = (profile.gender === 'female' || profile.gender === 'woman') ? 'female' : 'male';
          }
        }

        let draft = null;
        if (typeof StorageAdapter !== 'undefined' && StorageAdapter.loadDraft) {
          draft = StorageAdapter.loadDraft(TEST_ID);
        }
        if (!draft) {
          const raw = localStorage.getItem('mp_mcardle_draft') || localStorage.getItem(`mp_${TEST_ID}_draft`);
          if (raw) draft = JSON.parse(raw);
        }

        if (draft) {
          if (draft.age) inputAge.value = draft.age;
          if (draft.height) inputHeight.value = draft.height;
          if (draft.weight) inputWeight.value = draft.weight;
          if (draft.gender) gender = draft.gender;

          const vals = draft.bodyPartValues || draft.girths || draft;
          if (vals) {
            if (vals.overarm || vals.upperarm) bodyPartValues.overarm = vals.overarm || vals.upperarm;
            if (vals.underarm || vals.forearm) bodyPartValues.underarm = vals.underarm || vals.forearm;
            if (vals.talje || vals.waist) bodyPartValues.talje = vals.talje || vals.waist;
            if (vals.hofte || vals.hip) bodyPartValues.hofte = vals.hofte || vals.hip;
            if (vals.laar || vals.thigh) bodyPartValues.laar = vals.laar || vals.thigh;
            if (vals.laeg || vals.calf) bodyPartValues.laeg = vals.laeg || vals.calf;
          }
        }
      } catch (e) {
        console.warn('Kunne ikke hente gemte McArdle-data:', e);
      }
    }

    // --- STORAGE INTEGRATION: GEM KLADDE & PROFIL ---
    function saveDraftAndProfile() {
      const age = parseInt(inputAge.value, 10) || 0;
      const height = parseFloat(inputHeight.value) || 0;
      const weight = parseFloat(inputWeight.value) || 0;

      if (typeof StorageAdapter !== 'undefined' && StorageAdapter.saveProfile) {
        if (age > 0 || height > 0 || weight > 0) {
          StorageAdapter.saveProfile({
            ...(age > 0 && { age }),
            ...(height > 0 && { height }),
            ...(weight > 0 && { weight }),
            gender
          });
        }
      }

      const draftPayload = {
        gender,
        age: inputAge.value,
        height: inputHeight.value,
        weight: inputWeight.value,
        bodyPartValues: { ...bodyPartValues },
        girths: {
          upperarm: bodyPartValues.overarm,
          forearm: bodyPartValues.underarm,
          waist: bodyPartValues.talje,
          hip: bodyPartValues.hofte,
          thigh: bodyPartValues.laar,
          calf: bodyPartValues.laeg
        }
      };

      if (typeof StorageAdapter !== 'undefined' && StorageAdapter.saveDraft) {
        StorageAdapter.saveDraft(TEST_ID, draftPayload);
      }
      try {
        localStorage.setItem('mp_mcardle_draft', JSON.stringify(draftPayload));
      } catch (e) {}
    }

    function updateCategoryUI() {
      const catKey = getCurrentCategoryKey();
      const cat = categories[catKey];

      catBadge.textContent = cat.badge;
      diagramImg.src = cat.img;

      if (gender === 'male') {
        btnMale.classList.add("active");
        btnFemale.classList.remove("active");
      } else {
        btnFemale.classList.add("active");
        btnMale.classList.remove("active");
      }

      label1.textContent = cat.parts[0].label;
      sub1.textContent = cat.parts[0].sub;
      input1.dataset.part = cat.parts[0].id;
      input1.value = bodyPartValues[cat.parts[0].id] !== '' ? bodyPartValues[cat.parts[0].id] : '';

      label2.textContent = cat.parts[1].label;
      sub2.textContent = cat.parts[1].sub;
      input2.dataset.part = cat.parts[1].id;
      input2.value = bodyPartValues[cat.parts[1].id] !== '' ? bodyPartValues[cat.parts[1].id] : '';

      label3.textContent = cat.parts[2].label;
      sub3.textContent = cat.parts[2].sub;
      input3.dataset.part = cat.parts[2].id;
      input3.value = bodyPartValues[cat.parts[2].id] !== '' ? bodyPartValues[cat.parts[2].id] : '';

      calculateMcArdle();
    }

    function handleInputRecord(inputEl) {
      const partId = inputEl.dataset.part;
      if (partId) {
        bodyPartValues[partId] = inputEl.value;
      }
      saveDraftAndProfile();
      calculateMcArdle();
    }

    function calculateMcArdle() {
      const age = parseInt(inputAge.value, 10) || 0;
      const weight = parseFloat(inputWeight.value) || 0;
      const catKey = getCurrentCategoryKey();

      let density = 0;

      const m_overarm = parseFloat(bodyPartValues.overarm) || 0;
      const m_underarm = parseFloat(bodyPartValues.underarm) || 0;
      const m_talje = parseFloat(bodyPartValues.talje) || 0;
      const m_hofte = parseFloat(bodyPartValues.hofte) || 0;
      const m_laar = parseFloat(bodyPartValues.laar) || 0;
      const m_laeg = parseFloat(bodyPartValues.laeg) || 0;

      if (catKey === "m_young") {
        if (!m_overarm || !m_underarm || !m_talje) return resetDisplay();
        density = 1.1017 - (0.000282 * m_talje) + (0.000736 * m_underarm) - (0.0003 * m_overarm);
      } else if (catKey === "m_old") {
        if (!m_underarm || !m_talje || !m_hofte) return resetDisplay();
        density = 1.03 - (0.000288 * m_underarm) + (0.0007 * m_talje) - (0.0002 * m_hofte);
      } else if (catKey === "f_young") {
        if (!m_underarm || !m_talje || !m_laar) return resetDisplay();
        density = 1.0764 - (0.00081 * m_underarm) - (0.00088 * m_talje) + (0.00133 * m_laar);
      } else if (catKey === "f_old") {
        if (!m_talje || !m_laar || !m_laeg) return resetDisplay();
        density = 1.0602 - (0.00048 * m_talje) - (0.0005 * m_laar) + (0.00075 * m_laeg);
      }

      if (density <= 0) return resetDisplay();

      let bodyFat = (495 / density) - 450;
      bodyFat = Math.max(3, Math.min(55, bodyFat));

      resFatPct.textContent = bodyFat.toFixed(1);

      if (weight > 0) {
        const fatKg = weight * (bodyFat / 100);
        const leanKg = weight - fatKg;
        resFatMass.innerHTML = `${fatKg.toFixed(1)} <small>kg</small>`;
        resLeanMass.innerHTML = `${leanKg.toFixed(1)} <small>kg</small>`;
      } else {
        resFatMass.innerHTML = "- <small>kg</small>";
        resLeanMass.innerHTML = "- <small>kg</small>";
      }

      return { bodyFat, density };
    }

    function resetDisplay() {
      resFatPct.textContent = "0.0";
      resFatMass.innerHTML = "0.0 <small>kg</small>";
      resLeanMass.innerHTML = "0.0 <small>kg</small>";
      return null;
    }

    // --- GEM RESULTAT (COMMIT TO LOG) ---
    function commitResult() {
      const calcRes = calculateMcArdle();
      const weight = parseFloat(inputWeight.value) || 0;
      const height = parseFloat(inputHeight.value) || 0;
      const age = parseInt(inputAge.value, 10) || 0;

      if (!calcRes || !calcRes.bodyFat) {
        alert('Indtast venligst alle 3 påkrævede omkredsmålinger for at gemme.');
        return;
      }

      saveDraftAndProfile();

      if (typeof StorageAdapter !== 'undefined' && StorageAdapter.commitToLog) {
        const fatKg = weight > 0 ? (weight * calcRes.bodyFat / 100) : 0;
        const leanKg = weight > 0 ? (weight - fatKg) : 0;

        StorageAdapter.commitToLog(TEST_ID, {
          type: 'physical',
          primary: {
            value: parseFloat(calcRes.bodyFat.toFixed(1)),
            unit: '%',
            label: 'Fedtprocent'
          },
          subMetrics: {
            methodName: 'McArdle & Katch',
            fatMassKg: parseFloat(fatKg.toFixed(1)),
            leanMassKg: parseFloat(leanKg.toFixed(1)),
            density: parseFloat(calcRes.density.toFixed(4))
          },
          context: {
            gender,
            age,
            height,
            weight,
            bodyPartValues: { ...bodyPartValues },
            girths: {
              upperarm: bodyPartValues.overarm,
              forearm: bodyPartValues.underarm,
              waist: bodyPartValues.talje,
              hip: bodyPartValues.hofte,
              thigh: bodyPartValues.laar,
              calf: bodyPartValues.laeg
            }
          }
        });
      }

      if (btnCapture) {
        const origText = btnCapture.innerHTML;
        btnCapture.innerHTML = '✅ Gemt i loggen!';
        btnCapture.style.background = '#16a34a';
        setTimeout(() => {
          btnCapture.innerHTML = origText;
          btnCapture.style.background = '#2563eb';
        }, 2000);
      }
    }

    // Event Listeners
    btnMale.addEventListener("click", function() {
      gender = "male";
      saveDraftAndProfile();
      updateCategoryUI();
    });

    btnFemale.addEventListener("click", function() {
      gender = "female";
      saveDraftAndProfile();
      updateCategoryUI();
    });

    inputAge.addEventListener("input", () => {
      saveDraftAndProfile();
      updateCategoryUI();
    });
    
    inputHeight.addEventListener("input", () => {
      saveDraftAndProfile();
      calculateMcArdle();
    });

    inputWeight.addEventListener("input", () => {
      saveDraftAndProfile();
      calculateMcArdle();
    });

    input1.addEventListener("input", () => handleInputRecord(input1));
    input2.addEventListener("input", () => handleInputRecord(input2));
    input3.addEventListener("input", () => handleInputRecord(input3));

    btnCapture.addEventListener("click", commitResult);

    btnReset.addEventListener("click", function() {
      if (confirm('Vil du rydde alle indtastninger for McArdle & Katch?')) {
        Object.keys(bodyPartValues).forEach(k => bodyPartValues[k] = '');
        inputAge.value = '';
        inputHeight.value = '';
        inputWeight.value = '';
        if (typeof StorageAdapter !== 'undefined' && StorageAdapter.clearDraft) {
          StorageAdapter.clearDraft(TEST_ID);
        }
        localStorage.removeItem('mp_mcardle_draft');
        updateCategoryUI();
      }
    });

    // Start
    loadSavedData();
    updateCategoryUI();
  });
</script>
