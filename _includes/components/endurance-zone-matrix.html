<script>
  document.addEventListener('DOMContentLoaded', () => {
    const svg = document.getElementById('endurance-matrix-svg');
    const line = document.getElementById('mp-hover-line');
    const dot = document.getElementById('mp-line-dot');

    const pctText = document.getElementById('dash-pct-text');
    const dash3zone = document.getElementById('dash-3zone');

    const domain = document.getElementById('dash-domain');
    const dash7zone = document.getElementById('dash-7zone');

    const hr = document.getElementById('dash-hr');
    const rpe = document.getElementById('dash-rpe');

    function updateMatrix(posX) {
      const clampedX = Math.max(180, Math.min(960, posX));
      line.setAttribute('transform', `translate(${clampedX}, 0)`);

      const pct = Math.round(20 + ((clampedX - 180) / 780) * 80);
      pctText.textContent = `${pct}% Effort`;

      // Opdaterer Y-dot på laktatkurven
      let dotY = 155;
      if (pct < 40) dotY = 155 - (pct * 0.4);
      else if (pct < 70) dotY = 138 - ((pct - 40) * 1.0);
      else dotY = 108 - ((pct - 70) * 2.5);
      dot.setAttribute('cy', Math.max(dotY, 30));

      // Fysiologisk udlæsning til KPI-kortene
      if (clampedX < 480) {
        // ZONE 1 (3-ZONE)
        dash3zone.innerHTML = '<span class="mp-badge bg-green">Z1</span> Under LT1';
        domain.textContent = 'Moderate';

        if (pct < 32) {
          dash7zone.innerHTML = '<span class="mp-badge bg-blue">Z1</span> Restitution';
        } else {
          dash7zone.innerHTML = '<span class="mp-badge bg-green">Z2</span> Udholdenhed';
        }

        hr.textContent = '< 75% HRmax';
        rpe.textContent = 'Borg 6–12 (RPE 1–3)';
      } else if (clampedX < 710) {
        // ZONE 2 (3-ZONE)
        dash3zone.innerHTML = '<span class="mp-badge bg-yellow">Z2</span> LT1 til LT2';
        domain.textContent = 'Heavy';

        if (pct < 60) {
          dash7zone.innerHTML = '<span class="mp-badge bg-yellow">Z3</span> Tempo';
        } else {
          dash7zone.innerHTML = '<span class="mp-badge bg-orange">Z4</span> Tærskel';
        }

        hr.textContent = '75–90% HRmax';
        rpe.textContent = 'Borg 13–16 (RPE 4–6)';
      } else {
        // ZONE 3 (3-ZONE)
        dash3zone.innerHTML = '<span class="mp-badge bg-red">Z3</span> Over LT2';

        if (pct < 88) {
          domain.textContent = 'Severe';
          dash7zone.innerHTML = '<span class="mp-badge bg-red">Z5</span> VO2max';
        } else {
          domain.textContent = 'Extreme';
          dash7zone.innerHTML = '<span class="mp-badge bg-purple">Z6/7</span> Sprint';
        }

        hr.textContent = '> 90% HRmax';
        rpe.textContent = 'Borg 17–20 (RPE 7–10)';
      }
    }

    svg.addEventListener('mousemove', (e) => {
      const rect = svg.getBoundingClientRect();
      const svgX = ((e.clientX - rect.left) / rect.width) * 960;
      updateMatrix(svgX);
    });

    svg.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const rect = svg.getBoundingClientRect();
        const svgX = ((e.touches[0].clientX - rect.left) / rect.width) * 960;
        updateMatrix(svgX);
      }
    });

    updateMatrix(350);
  });
</script>
