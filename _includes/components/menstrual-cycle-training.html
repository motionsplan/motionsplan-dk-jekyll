<div class="cycle-calc-wrapper">
  <style>
    .cycle-calc-wrapper {
      background: var(--background-color, #ffffff);
      border: 1px solid var(--border-color, #e1e4e8);
      border-radius: 12px;
      padding: 24px;
      margin: 2em 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .cycle-calc-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .calc-group {
      display: flex;
      flex-direction: column;
    }
    .calc-group label {
      font-weight: 600;
      font-size: 0.88em;
      margin-bottom: 6px;
      color: #333;
    }
    .calc-input {
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95em;
    }
    .chart-container {
      position: relative;
      width: 100%;
      background: #fafafa;
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #e5e7eb;
    }
    .chart-container svg {
      cursor: pointer;
      display: block;
    }
    .hormone-legend {
      display: flex;
      justify-content: center;
      gap: 24px;
      font-size: 0.85em;
      font-weight: 500;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #f0f0f0;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-line {
      width: 22px;
      height: 3px;
      border-radius: 2px;
    }
    .legend-line.dashed {
      background: repeating-linear-gradient(90deg, #2a9d8f, #2a9d8f 4px, transparent 4px, transparent 7px);
      height: 3px;
    }
    .output-card {
      background: #ffffff;
      border-left: 5px solid #ff477e;
      padding: 18px;
      border-radius: 8px;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: border-color 0.3s ease;
    }
    .output-card h4 {
      margin: 0 0 10px 0;
      color: #1a1a1a;
      font-size: 1.15em;
    }
    .output-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .output-box {
      background: #f8f9fa;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 0.9em;
      line-height: 1.45;
      border: 1px solid #edf2f7;
    }
    .output-box strong {
      display: block;
      color: #2d3748;
      margin-bottom: 4px;
      font-size: 0.95em;
    }
  </style>

  <div class="cycle-calc-inputs">
    <div class="calc-group">
      <label for="startDate">Første dag i seneste menstruation:</label>
      <input type="date" id="startDate" class="calc-input">
    </div>
    <div class="calc-group">
      <label for="cycleLength">Gns. cykluslængde (dage):</label>
      <input type="number" id="cycleLength" class="calc-input" value="28" min="20" max="40">
    </div>
  </div>

  <div class="chart-container" id="chartContainer" title="Klik på grafen for at udforske en specifik dag">
    <svg viewBox="0 0 500 205" width="100%" height="auto" id="cycleSvg">
      <!-- FASE TITLER ØVERST MED EGET LUFT-AREAL -->
      <text x="44" y="15" font-size="10" font-weight="700" fill="#a4133c" text-anchor="middle">Menstruation</text>
      <text x="160" y="15" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="middle">Follikulær fase</text>
      <text x="259" y="15" font-size="10" font-weight="700" fill="#b5828c" text-anchor="middle">Ægløsning</text>
      <text x="393" y="15" font-size="10" font-weight="700" fill="#6a4c93" text-anchor="middle">Lutealfase</text>

      <!-- FASER BAGGRUNDSSKATTERING (Start ved y=28) -->
      <rect x="0" y="28" width="89" height="132" fill="#ffe5ec" opacity="0.75"/>
      <rect x="89" y="28" width="143" height="132" fill="#e8f5e9" opacity="0.75"/>
      <rect x="232" y="28" width="54" height="132" fill="#fff9c4" opacity="0.75"/>
      <rect x="286" y="28" width="214" height="132" fill="#f3e5f5" opacity="0.75"/>

      <!-- Lodrette opdelingslinjer mellem faser -->
      <line x1="89" y1="28" x2="89" y2="160" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="232" y1="28" x2="232" y2="160" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="286" y1="28" x2="286" y2="160" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="2,2"/>

      <!-- Bundlinje / Akse -->
      <line x1="0" y1="160" x2="500" y2="160" stroke="#cccccc" stroke-width="1.5"/>

      <!-- GLATTE FYSIOLOGISKE HORMONKURVER -->
      <!-- Østrogen (Pink solid kurve) -->
      <path d="M 0,152 C 60,149 130,125 205,48 C 225,25 245,100 265,110 C 310,125 350,85 410,100 C 460,113 480,144 500,152" 
            fill="none" stroke="#ff477e" stroke-width="3" stroke-linecap="round"/>

      <!-- Progesteron (Teal stiplede kurve) -->
      <path d="M 0,156 L 225,156 C 265,156 310,147 345,55 C 375,55 425,75 465,124 C 485,152 495,156 500,156" 
            fill="none" stroke="#2a9d8f" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>

      <!-- DYNAMISK MARKØR (Dag i cyklus) -->
      <g id="markerGroup">
        <line id="dayMarker" x1="0" y1="28" x2="0" y2="160" stroke="#1a1a1a" stroke-width="2"/>
        <rect id="badgeBg" x="-20" y="31" width="40" height="16" rx="4" fill="#1a1a1a"/>
        <text id="badgeText" x="0" y="42" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Dag 1</text>
        <circle id="dayDot" cx="0" cy="160" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
      </g>

      <!-- X-AKSE LABELS (Bund) -->
      <text x="5" y="180" font-size="10" fill="#777777">Dag 1</text>
      <text x="259" y="180" font-size="10" fill="#777777" text-anchor="middle" id="svgLabelMid">Ægløsning (~Dag 14)</text>
      <text x="495" y="180" font-size="10" fill="#777777" text-anchor="end" id="svgLabelEnd">Dag 28</text>
    </svg>

    <!-- HORMON LEGEND KUN I BUNDEN -->
    <div class="hormone-legend">
      <div class="legend-item">
        <div class="legend-line" style="background:#ff477e;"></div>
        <span>Østrogen</span>
      </div>
      <div class="legend-item">
        <div class="legend-line dashed"></div>
        <span>Progesteron</span>
      </div>
    </div>
  </div>

  <div id="outputCard" class="output-card">
    <h4 id="phaseTitle">Indtast oplysninger for at beregne fase</h4>
    <div class="output-grid">
      <div class="output-box">
        <strong>🧪 Hormonel Profil</strong>
        <span id="hormoneInfo">Indtast dato i feltet ovenfor.</span>
      </div>
      <div class="output-box">
        <strong>🏋️‍♂️ Træningsfokus</strong>
        <span id="trainingInfo">-</span>
      </div>
      <div class="output-box">
        <strong>🥗 Ernæring & Restitution</strong>
        <span id="nutritionInfo">-</span>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const startDateInput = document.getElementById('startDate');
    const cycleLengthInput = document.getElementById('cycleLength');
    const dayMarker = document.getElementById('dayMarker');
    const dayDot = document.getElementById('dayDot');
    const badgeBg = document.getElementById('badgeBg');
    const badgeText = document.getElementById('badgeText');
    const phaseTitle = document.getElementById('phaseTitle');
    const hormoneInfo = document.getElementById('hormoneInfo');
    const trainingInfo = document.getElementById('trainingInfo');
    const nutritionInfo = document.getElementById('nutritionInfo');
    const outputCard = document.getElementById('outputCard');
    const svgLabelEnd = document.getElementById('svgLabelEnd');
    const svgLabelMid = document.getElementById('svgLabelMid');
    const cycleSvg = document.getElementById('cycleSvg');

    // Standard dato: 9 dage siden
    const defaultDate = new Date();
    defaultDate.setDate(defaultDate.getDate() - 9);
    startDateInput.value = defaultDate.toISOString().split('T')[0];

    function updateCycle(overrideDay) {
      const startDate = new Date(startDateInput.value);
      const cycleLength = parseInt(cycleLengthInput.value) || 28;
      
      svgLabelEnd.textContent = `Dag ${cycleLength}`;
      svgLabelMid.textContent = `Ægløsning (~Dag ${Math.round(cycleLength / 2)})`;

      let currentDay;

      if (overrideDay !== undefined) {
        currentDay = overrideDay;
      } else {
        if (isNaN(startDate.getTime())) return;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        startDate.setHours(0, 0, 0, 0);

        const diffTime = today - startDate;
        let diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
        currentDay = (diffDays % cycleLength) + 1;
        if (currentDay <= 0) currentDay += cycleLength;
      }

      // Beregn X-position i SVG (0 til 500)
      const xPos = Math.max(5, Math.min(495, ((currentDay - 1) / (cycleLength - 1)) * 500));
      
      dayMarker.setAttribute('x1', xPos);
      dayMarker.setAttribute('x2', xPos);
      dayDot.setAttribute('cx', xPos);
      badgeBg.setAttribute('x', xPos - 20);
      badgeText.setAttribute('x', xPos);
      badgeText.textContent = `Dag ${currentDay}`;

      const normDay = (currentDay / cycleLength) * 28;

      let phase = "";
      let color = "#ff477e";

      if (normDay <= 5) {
        phase = "Menstruationsfase";
        color = "#e63946";
        phaseTitle.textContent = `Dag ${currentDay} af ${cycleLength}: ${phase}`;
        hormoneInfo.textContent = "Lave niveauer af både østrogen og progesteron. Lav kernekropstemperatur.";
        trainingInfo.textContent = "Fokus på rolige bevægelser, let udholdenhedstræning eller mobilitet. Lyt til kroppen ved mavesmerter.";
        nutritionInfo.textContent = "Prioritér jernrig kost, antiinflammatoriske fedtsyrer og tilstrækkeligt væskeindtag.";
      } else if (normDay <= 13) {
        phase = "Follikulær fase (Sen)";
        color = "#2a9d8f";
        phaseTitle.textContent = `Dag ${currentDay} af ${cycleLength}: ${phase}`;
        hormoneInfo.textContent = "Stigende østrogen, lavt progesteron. Høj insulinfølsomhed og god kulhydratudnyttelse.";
        trainingInfo.textContent = "Optimelt tidspunkt for tung styrketræning (PR-forsøg), eksplosive løft og HIIT-intervaller.";
        nutritionInfo.textContent = "Kroppen er effektiv til at forbrænde kulhydrater. Fyld energidepoterne op før intensive pas.";
      } else if (normDay <= 16) {
        phase = "Ægløsningsfase (Ovulation)";
        color = "#e9c46a";
        phaseTitle.textContent = `Dag ${currentDay} af ${cycleLength}: ${phase}`;
        hormoneInfo.textContent = "Østrogen topper, svagt øget testosteron. Maksimal styrkekapacitet.";
        trainingInfo.textContent = "Høj ydeevne og maksimal muskelstyrke. Vær ekstra omhyggelig med opvarmning og løfteteknik.";
        nutritionInfo.textContent = "Hold proteinsyntesen høj med jævnt proteinindtag over dagen.";
      } else {
        phase = "Lutealfase";
        color = "#9c27b0";
        phaseTitle.textContent = `Dag ${currentDay} af ${cycleLength}: ${phase}`;
        hormoneInfo.textContent = "Højt progesteron og moderat østrogen. Forhøjet kernetemperatur og øget proteinnedbrydning.";
        trainingInfo.textContent = "Gunstigt for moderat udholdenhed (Zone 2) og styrketræning med højere rep-ranges. Indlæg deload sidst i fasen.";
        nutritionInfo.textContent = "Forbrændingen stiger let (100-300 kcal/dag). Øg proteinindtaget for at modvirke øget nedbrydning.";
      }

      outputCard.style.borderLeftColor = color;
    }

    cycleSvg.addEventListener('click', function(e) {
      const rect = cycleSvg.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = Math.max(0, Math.min(1, clickX / rect.width));
      const cycleLength = parseInt(cycleLengthInput.value) || 28;
      const clickedDay = Math.max(1, Math.min(cycleLength, Math.round(pct * (cycleLength - 1)) + 1));
      updateCycle(clickedDay);
    });

    startDateInput.addEventListener('change', () => updateCycle());
    cycleLengthInput.addEventListener('input', () => updateCycle());
    updateCycle();
  })();
</script>
