<div id="opvarmning-widget-container" class="opvarmning-player-card" style="position: relative; background: #ffffff; border: 3px solid #0284c7; border-radius: 14px; padding: 20px; margin: 25px 0; box-shadow: 0 10px 25px rgba(0,0,0,0.08); font-family: inherit; transition: border-color 0.4s ease;">
  
  <!-- FULD OVERLAY PROGRAM-PANEL -->
  <div id="player-modal-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; border-radius: 12px; z-index: 100; padding: 20px; box-sizing: border-box; flex-direction: column;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 12px;">
      <div>
        <h4 style="margin: 0; color: #0f172a; font-size: 1.1em; font-weight: 800;">📋 Hele Opvarmningsprogrammet</h4>
        <p style="margin: 2px 0 0 0; font-size: 0.8em; color: #64748b;">Klik på en øvelse for at hoppe direkte dertil</p>
      </div>
      <button id="btn-close-modal" type="button" style="background: #f1f5f9; border: 1px solid #cbd5e1; color: #0f172a; font-size: 1.2em; font-weight: bold; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
        ✖
      </button>
    </div>
    <div id="player-modal-list" style="flex: 1; overflow-y: auto; padding-right: 4px;"></div>
  </div>

  <!-- OVERSKRIFT & HEADER -->
  <div style="text-align: center; margin-bottom: 16px;">
    <span id="section-badge" style="background: #e0f2fe; color: #0369a1; font-size: 0.78em; font-weight: 800; padding: 4px 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.3s ease;">
      1. Løbedel
    </span>
    <h3 style="margin: 8px 0 2px 0; color: #0f172a; font-size: 1.4em;">⏱️ Politiets Opvarmnings-Timer</h3>
    <p style="margin: 0; color: #64748b; font-size: 0.88em;">Automatisk tidtagning i løbe- og hoppedel — Manuel styring i styrkedelen.</p>
  </div>

  <!-- HOVED-DISPLAY -->
  <div id="player-display-box" style="background: #0f172a; color: #ffffff; border-radius: 12px; padding: 22px 18px; text-align: center; margin-bottom: 16px; position: relative; overflow: hidden; transition: background-color 0.4s ease;">
    <div id="player-category" style="font-size: 0.85em; font-weight: bold; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; transition: color 0.3s ease;">
      1. LØBEDEL
    </div>
    <div id="player-exercise" style="font-size: 1.65em; font-weight: 800; min-height: 2.2em; display: flex; align-items: center; justify-content: center; line-height: 1.2; color: #f8fafc;">
      Indlæser...
    </div>
    <div id="player-status-msg" style="font-size: 0.88em; font-weight: 700; color: #facc15; min-height: 1.4em; margin-top: -4px; margin-bottom: 4px;">
      ▶ Tryk på Start for at begynde
    </div>
    <div id="player-timer" style="font-size: 3.6em; font-weight: 900; color: #38bdf8; font-variant-numeric: tabular-nums; margin: 2px 0 8px 0; transition: color 0.3s ease;">
      00:30
    </div>
    <div style="font-size: 0.83em; color: #94a3b8; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 8px; margin-top: 8px;">
      Næste: <span id="player-next-exercise" style="color: #cbd5e1; font-weight: 600;">-</span>
    </div>
    <div style="width: 100%; background: rgba(255,255,255,0.15); height: 6px; border-radius: 3px; margin-top: 12px; overflow: hidden;">
      <div id="player-progress" style="width: 0%; background: #38bdf8; height: 100%; transition: width 0.3s linear, background-color 0.3s ease;"></div>
    </div>
  </div>

  <!-- BETJENINGSKNAPPER -->
  <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
    <button id="btn-start-pause" type="button" style="background: #16a34a; color: white; border: none; padding: 12px 22px; border-radius: 8px; font-weight: bold; font-size: 0.98em; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s;">
      <span id="btn-icon">▶</span> <span id="btn-text">Start</span>
    </button>
    <button id="btn-next-step" type="button" style="background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 12px 18px; border-radius: 8px; font-weight: bold; font-size: 0.9em; cursor: pointer;">
      ⏭️ Næste
    </button>
    <button id="btn-reset" type="button" style="background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; padding: 12px 16px; border-radius: 8px; font-weight: bold; font-size: 0.9em; cursor: pointer;">
      🔄 Nulstil
    </button>
    <button id="btn-open-modal" type="button" style="background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 12px 18px; border-radius: 8px; font-weight: bold; font-size: 0.9em; cursor: pointer;">
      📋 Program
    </button>
  </div>
</div>

<script>
// Alt er pakket ind i sit eget objekt for at undgå fejl i WordPress/Sidebyggere
var PolitiOpvarmningPlayer = {
  themes: {
    "1. Løbedel": { main: "#0284c7", accent: "#38bdf8", badgeBg: "#e0f2fe", badgeText: "#0369a1", bgDark: "#0f172a" },
    "2. Hoppedel": { main: "#d97706", accent: "#fbbf24", badgeBg: "#fef3c7", badgeText: "#b45309", bgDark: "#1e1b18" },
    "3. Styrkedel": { main: "#4f46e5", accent: "#a5b4fc", badgeBg: "#e0e7ff", badgeText: "#3730a3", bgDark: "#13122b" }
  },
  program: [
    { cat: "1. Løbedel", name: "Almindeligt Løb", type: "time", dur: 30, switchHalf: false },
    { cat: "1. Løbedel", name: "Løb m. rundsving fremad", type: "time", dur: 30, switchHalf: true },
    { cat: "1. Løbedel", name: "Løb m. rundsving bagud", type: "time", dur: 30, switchHalf: true },
    { cat: "1. Løbedel", name: "Sidesteps", type: "time", dur: 30, switchHalf: true },
    { cat: "1. Løbedel", name: "Krydsløb", type: "time", dur: 30, switchHalf: true },
    { cat: "1. Løbedel", name: "Gadedrengeløb", type: "time", dur: 30, switchHalf: false },
    { cat: "1. Løbedel", name: "Baglæns løb", type: "time", dur: 30, switchHalf: false },
    { cat: "1. Løbedel", name: "Reaktionsøvelser (Klap i gulv)", type: "time", dur: 30, switchHalf: false },
    { cat: "2. Hoppedel", name: "Sprællemand", type: "time", dur: 30, prep: 5, switchHalf: false },
    { cat: "2. Hoppedel", name: "Skihop", type: "time", dur: 30, prep: 5, switchHalf: false },
    { cat: "2. Hoppedel", name: "Sprællemand m. 360° rotation", type: "time", dur: 30, prep: 5, switchHalf: true },
    { cat: "2. Hoppedel", name: "Skihop m. 360° rotation", type: "time", dur: 30, prep: 5, switchHalf: true },
    { cat: "2. Hoppedel", name: "Fejesving m. to rundsving", type: "time", dur: 30, prep: 5, switchHalf: false },
    { cat: "2. Hoppedel", name: "Knæ-til-albue", type: "time", dur: 30, prep: 5, switchHalf: false },
    { cat: "2. Hoppedel", name: "Fod-til-hånd", type: "time", dur: 30, prep: 5, switchHalf: false },
    { cat: "2. Hoppedel", name: "Englehop", type: "time", dur: 30, prep: 5, switchHalf: false },
    { cat: "3. Styrkedel", name: "Mavebøjninger", type: "reps", repsText: "12 gentagelser" },
    { cat: "3. Styrkedel", name: "Rygbøjninger", type: "reps", repsText: "12 gentagelser" },
    { cat: "3. Styrkedel", name: "Benbøjninger", type: "reps", repsText: "12 gentagelser" },
    { cat: "3. Styrkedel", name: "Armstrækninger", type: "reps", repsText: "12 gentagelser" },
    { cat: "3. Styrkedel", name: "Sakseben", type: "reps", repsText: "12 Højre + 12 Venstre" },
    { cat: "3. Styrkedel", name: "Lunges / Fremfald", type: "reps", repsText: "6 Højre + 6 Venstre" },
    { cat: "3. Styrkedel", name: "Mountain Climbers", type: "reps", repsText: "12 Højre + 12 Venstre" }
  ],
  
  // Interne state variabler
  hasStarted: false,
  currentIndex: 0,
  timeLeft: 30,
  elapsedRepsTime: 0,
  inPrepState: false,
  prepLeft: 0,
  timerInterval: null,
  isRunning: false,
  isSectionBreak: false,
  isFinished: false,
  audioCtx: null,

  init: function() {
    this.bindEvents();
    this.hardReset(); // Tvinger en ren startskærm med det samme
  },

  bindEvents: function() {
    var self = this;
    document.getElementById('btn-start-pause').addEventListener('click', function() { self.togglePlayPause(); });
    document.getElementById('btn-next-step').addEventListener('click', function() { self.skipExercise(); });
    document.getElementById('btn-reset').addEventListener('click', function() { self.hardReset(); });
    document.getElementById('btn-open-modal').addEventListener('click', function() { self.openModal(); });
    document.getElementById('btn-close-modal').addEventListener('click', function() { self.closeModal(); });
  },

  playBeep: function(freq, duration) {
    try {
      if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
      var osc = this.audioCtx.createOscillator();
      var gain = this.audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq || 600;
      gain.gain.setValueAtTime(0.2, this.audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(this.audioCtx.destination);
      osc.start();
      osc.stop(this.audioCtx.currentTime + (duration || 0.15));
    } catch (e) {}
  },

  playSectionChime: function() {
    var self = this;
    this.playBeep(523, 0.15);
    setTimeout(function() { self.playBeep(659, 0.15); }, 150);
    setTimeout(function() { self.playBeep(783, 0.25); }, 300);
  },

  stopTimer: function() {
    this.isRunning = false;
    if (this.timerInterval) {
      clearInterval(this.timerInterval);
      this.timerInterval = null;
    }
  },

  // DENNE FUNKTION GARANTERER AT ALT NULSTILLES
  hardReset: function() {
    this.stopTimer();
    this.hasStarted = false;
    this.currentIndex = 0;
    this.timeLeft = this.program[0].dur;
    this.elapsedRepsTime = 0;
    this.inPrepState = false;
    this.prepLeft = 0;
    this.isSectionBreak = false;
    this.isFinished = false;
    this.closeModal();
    this.updateUI();
  },

  updateUI: function() {
    var theme = this.themes["1. Løbedel"];

    // 1. STARTSKÆRM / NULSTILLET
    if (!this.hasStarted) {
      document.getElementById('opvarmning-widget-container').style.borderColor = theme.main;
      document.getElementById('player-display-box').style.backgroundColor = theme.bgDark;
      document.getElementById('player-category').style.color = theme.accent;
      document.getElementById('player-category').innerText = "1. LØBEDEL";
      
      // Sætter titlen tilbage til "Tryk på Start"
      document.getElementById('player-exercise').innerText = "Tryk på Start";
      document.getElementById('player-status-msg').innerText = "▶ Tryk på Start for at begynde";
      document.getElementById('player-timer').innerText = "00:30";
      document.getElementById('player-timer').style.color = theme.accent;
      
      document.getElementById('player-progress').style.width = "0%";
      document.getElementById('player-progress').style.backgroundColor = theme.accent;
      
      var badge = document.getElementById('section-badge');
      badge.innerText = "1. Løbedel";
      badge.style.backgroundColor = theme.badgeBg;
      badge.style.color = theme.badgeText;

      document.getElementById('btn-text').innerText = 'Start';
      document.getElementById('btn-start-pause').style.background = '#16a34a';
      document.getElementById('btn-icon').innerText = '▶';
      document.getElementById('player-next-exercise').innerText = this.program[0].name + " (1. Løbedel)";
      this.renderModalList();
      return;
    }

    // 2. GENNEMFØRT
    if (this.isFinished) {
      document.getElementById('player-category').innerText = "Gennemført!";
      document.getElementById('player-exercise').innerText = "🎉 Flot klaret! Du er klar til testen.";
      document.getElementById('player-timer').innerText = "00:00";
      document.getElementById('player-status-msg').innerHTML = "&nbsp;";
      document.getElementById('player-progress').style.width = "100%";
      document.getElementById('btn-text').innerText = 'Start forfra';
      document.getElementById('btn-start-pause').style.background = '#16a34a';
      document.getElementById('btn-icon').innerText = '▶';
      document.getElementById('player-next-exercise').innerText = "-";
      this.renderModalList();
      return;
    }

    // 3. AKTIV ØVELSE
    var current = this.program[this.currentIndex];
    var next = this.program[this.currentIndex + 1];
    theme = this.themes[current.cat] || this.themes["1. Løbedel"];

    document.getElementById('opvarmning-widget-container').style.borderColor = theme.main;
    document.getElementById('player-display-box').style.backgroundColor = theme.bgDark;
    document.getElementById('player-category').style.color = theme.accent;
    document.getElementById('player-timer').style.color = theme.accent;
    document.getElementById('player-progress').style.backgroundColor = theme.accent;

    var badge = document.getElementById('section-badge');
    badge.innerText = current.cat;
    badge.style.backgroundColor = theme.badgeBg;
    badge.style.color = theme.badgeText;

    var statusEl = document.getElementById('player-status-msg');

    if (this.isSectionBreak) {
      document.getElementById('player-category').innerText = "⏸ PAUSE & REGRUPPERING";
      document.getElementById('player-exercise').innerText = "Næste del: " + current.cat;
      statusEl.innerText = "Gør klar til næste sektion!";
      document.getElementById('player-timer').innerText = "PAUSE";
      document.getElementById('btn-text').innerText = "Start " + current.cat;
      document.getElementById('btn-start-pause').style.background = theme.main;
      document.getElementById('btn-icon').innerText = '▶';
    } 
    else if (this.inPrepState) {
      document.getElementById('player-category').innerText = current.cat + " — GØR KLAR";
      document.getElementById('player-exercise').innerText = "Næste: " + current.name;
      statusEl.innerText = "⏳ Gør dig klar til start!";
      var minsPrep = Math.floor(this.prepLeft / 60).toString().padStart(2, '0');
      var secsPrep = (this.prepLeft % 60).toString().padStart(2, '0');
      document.getElementById('player-timer').innerText = minsPrep + ":" + secsPrep;
      document.getElementById('btn-text').innerText = 'Pause';
      document.getElementById('btn-start-pause').style.background = '#dc2626';
      document.getElementById('btn-icon').innerText = '⏸';
    }
    else {
      document.getElementById('player-category').innerText = current.cat;
      document.getElementById('player-exercise').innerText = current.name;
      
      if (current.type === "reps") {
        var minsReps = Math.floor(this.elapsedRepsTime / 60).toString().padStart(2, '0');
        var secsReps = (this.elapsedRepsTime % 60).toString().padStart(2, '0');
        document.getElementById('player-timer').innerText = minsReps + ":" + secsReps;
        statusEl.innerText = "💪 " + current.repsText + " — Tryk Næste når færdig";
      } else {
        var mins = Math.floor(this.timeLeft / 60).toString().padStart(2, '0');
        var secs = (this.timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('player-timer').innerText = mins + ":" + secs;

        if (current.switchHalf && this.timeLeft <= 15) {
          statusEl.innerText = "↔️ Skift side / retning nu!";
        } else if (current.switchHalf && this.timeLeft > 15) {
          statusEl.innerText = "(Skiftes ved 15 sek)";
        } else {
          statusEl.innerHTML = "&nbsp;";
        }
      }

      if (!this.isRunning) {
        document.getElementById('btn-text').innerText = 'Fortsæt';
        document.getElementById('btn-start-pause').style.background = '#16a34a';
        document.getElementById('btn-icon').innerText = '▶';
      } else {
        document.getElementById('btn-text').innerText = 'Pause';
        document.getElementById('btn-start-pause').style.background = '#dc2626';
        document.getElementById('btn-icon').innerText = '⏸';
      }
    }

    document.getElementById('player-next-exercise').innerText = next ? (next.name + " (" + next.cat + ")") : "Slut på opvarmningen!";

    var progressPct = ((this.currentIndex + (this.isSectionBreak || this.inPrepState ? 0 : 0.8)) / this.program.length) * 100;
    document.getElementById('player-progress').style.width = progressPct + "%";
    this.renderModalList();
  },

  togglePlayPause: function() {
    if (this.isFinished || !this.hasStarted) {
      this.hasStarted = true;
      this.isFinished = false;
      this.currentIndex = 0;
      this.timeLeft = this.program[0].dur;
      this.startTimer();
    } else if (this.isSectionBreak) {
      this.isSectionBreak = false;
      var current = this.program[this.currentIndex];
      if (current.prep) {
        this.inPrepState = true;
        this.prepLeft = current.prep;
      }
      this.startTimer();
    } else if (this.isRunning) {
      this.stopTimer();
      this.updateUI();
    } else {
      this.startTimer();
    }
  },

  startTimer: function() {
    var self = this;
    this.stopTimer();
    this.isRunning = true;
    this.updateUI();

    if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    this.timerInterval = setInterval(function() {
      var current = self.program[self.currentIndex];

      if (self.inPrepState) {
        self.prepLeft--;
        self.playBeep(500, 0.08);
        if (self.prepLeft <= 0) {
          self.inPrepState = false;
          self.playBeep(900, 0.25);
        }
        self.updateUI();
        return;
      }

      if (current.type === "reps") {
        self.elapsedRepsTime++;
        self.updateUI();
      } else {
        self.timeLeft--;

        if (self.timeLeft === 15 && current.switchHalf) {
          self.playBeep(750, 0.1);
          setTimeout(function() { self.playBeep(900, 0.15); }, 150);
        }
        if (self.timeLeft <= 3 && self.timeLeft > 0) {
          self.playBeep(440, 0.1);
        }

        if (self.timeLeft <= 0) {
          self.playBeep(880, 0.3);
          self.skipExercise(true);
        } else {
          self.updateUI();
        }
      }
    }, 1000);
  },

  skipExercise: function(autoTriggered) {
    var wasRunning = this.isRunning;
    this.stopTimer();
    this.hasStarted = true;
    this.isSectionBreak = false;
    this.inPrepState = false;
    this.isFinished = false;

    if (this.currentIndex < this.program.length - 1) {
      var currentCat = this.program[this.currentIndex].cat;
      var nextItem = this.program[this.currentIndex + 1];

      this.currentIndex++;
      this.timeLeft = nextItem.dur || 30;
      this.elapsedRepsTime = 0;

      if (currentCat !== nextItem.cat && autoTriggered) {
        this.isSectionBreak = true;
        this.playSectionChime();
        this.updateUI();
      } else if (nextItem.prep) {
        this.inPrepState = true;
        this.prepLeft = nextItem.prep;
        this.updateUI();
        if (wasRunning || autoTriggered) this.startTimer();
      } else {
        this.updateUI();
        if (wasRunning || autoTriggered) this.startTimer();
      }
    } else {
      this.isFinished = true;
      this.updateUI();
    }
  },

  jumpToExercise: function(index) {
    var wasRunning = this.isRunning;
    this.stopTimer();
    this.hasStarted = true;
    this.isSectionBreak = false;
    this.inPrepState = false;
    this.isFinished = false;
    
    this.currentIndex = index;
    var item = this.program[index];
    this.timeLeft = item.dur || 30;
    this.elapsedRepsTime = 0;
    
    if (item.prep) {
      this.inPrepState = true;
      this.prepLeft = item.prep;
    }

    this.closeModal();
    this.updateUI();
    if (wasRunning) this.startTimer();
  },

  openModal: function() {
    document.getElementById('player-modal-overlay').style.display = 'flex';
    this.renderModalList();
  },

  closeModal: function() {
    document.getElementById('player-modal-overlay').style.display = 'none';
  },

  renderModalList: function() {
    var container = document.getElementById('player-modal-list');
    if (!container) return;
    var html = '';
    var lastCat = '';
    var self = this;

    this.program.forEach(function(item, idx) {
      var theme = self.themes[item.cat];
      if (item.cat !== lastCat) {
        lastCat = item.cat;
        html += '<div style="font-weight: 800; color: ' + theme.main + '; margin-top: 12px; margin-bottom: 6px; font-size: 0.88em; text-transform: uppercase;">' + item.cat + '</div>';
      }
      var isActive = self.hasStarted && idx === self.currentIndex && !self.isSectionBreak && !self.isFinished;
      var bg = isActive ? theme.main : '#ffffff';
      var textColor = isActive ? '#ffffff' : '#334155';
      var border = isActive ? '2px solid ' + theme.main : '1px solid #cbd5e1';

      html += '<div class="modal-item" data-idx="' + idx + '" style="background: ' + bg + '; color: ' + textColor + '; border: ' + border + '; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 0.9em; transition: all 0.15s;">' +
        '<div><strong>' + (idx + 1) + '. ' + item.name + '</strong>' +
        (item.type === 'reps' ? '<span style="font-size: 0.82em; opacity: 0.85; margin-left: 6px;">(' + item.repsText + ')</span>' : '') +
        (item.switchHalf ? '<span style="font-size: 0.82em; opacity: 0.85; margin-left: 6px;">(Skift v. 15s)</span>' : '') +
        '</div><div style="font-size: 0.82em; font-weight: bold; opacity: 0.9;">' +
        (isActive ? '👉 AKTIV' : (item.type === 'reps' ? 'Reps' : '30s')) + '</div></div>';
    });
    
    container.innerHTML = html;
    
    // Gør alle punkterne klikbare i den nye objekt-struktur
    var items = container.querySelectorAll('.modal-item');
    for(var i = 0; i < items.length; i++) {
      items[i].addEventListener('click', function() {
        var idx = parseInt(this.getAttribute('data-idx'), 10);
        self.jumpToExercise(idx);
      });
    }
  }
};

document.addEventListener("DOMContentLoaded", function() {
  PolitiOpvarmningPlayer.init();
});
</script>
