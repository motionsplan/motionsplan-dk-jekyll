<div class="sleep-widget-container" style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 20px; margin: 20px 0;">
  <h3 style="margin-top: 0;">⏱️ Søvncyklus-beregner</h3>
  
  <div style="margin-bottom: 15px;">
    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Hvad vil du beregne?</label>
    <select id="sleep-mode" onchange="calculateSleep()" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
      <option value="wake">Jeg ved, hvornår jeg skal VÅGNE</option>
      <option value="now">Jeg går i seng NU</option>
    </select>
  </div>

  <div id="wake-time-group" style="margin-bottom: 15px;">
    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Hvornår skal du op?</label>
    <input type="time" id="wake-time" value="07:00" onchange="calculateSleep()" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc; width: 100%; max-width: 200px;">
  </div>

  <div style="margin-bottom: 15px;">
    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Tid til at falde i søvn (minutter):</label>
    <input type="number" id="latency" value="15" min="0" max="60" onchange="calculateSleep()" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc; width: 100%; max-width: 100px;">
  </div>

  <hr style="border: 0; border-top: 1px solid #dee2e6; margin: 20px 0;">

  <div id="sleep-results">
    <!-- Resultaterne genereres her via JS -->
  </div>
</div>

<script>
function calculateSleep() {
  const mode = document.getElementById('sleep-mode').value;
  const wakeInput = document.getElementById('wake-time').value;
  const latency = parseInt(document.getElementById('latency').value) || 0;
  const wakeGroup = document.getElementById('wake-time-group');
  const resultsDiv = document.getElementById('sleep-results');

  if (mode === 'now') {
    wakeGroup.style.display = 'none';
  } else {
    wakeGroup.style.display = 'block';
  }

  const cycleMinutes = 90;
  let html = '';

  if (mode === 'wake') {
    if (!wakeInput) return;
    const [hours, minutes] = wakeInput.split(':').map(Number);
    let targetDate = new Date();
    targetDate.setHours(hours, minutes, 0, 0);

    html += `<p style="margin-bottom: 10px;">For at vågne frisk kl. <strong>${wakeInput}</strong> bør du slukke lyset og gå i seng på et af følgende tidspunkter:</p><ul>`;

    // Beregn for 6, 5, 4 og 3 cyklusser bagud
    const cycles = [6, 5, 4, 3];
    cycles.forEach(c => {
      let bedTime = new Date(targetDate.getTime() - (c * cycleMinutes + latency) * 60000);
      let timeStr = bedTime.toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });
      let badge = '';
      
      if (c === 5) badge = ' <span style="background: #28a745; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8em;">Anbefalet (7,5 t)</span>';
      if (c === 6) badge = ' <span style="background: #17a2b8; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8em;">Lang søvn (9 t)</span>';
      if (c === 4) badge = ' <span style="background: #ffc107; color: black; padding: 2px 6px; border-radius: 4px; font-size: 0.8em;">Kort søvn (6 t)</span>';

      html += `<li style="margin-bottom: 8px;">Kl. <strong>${timeStr}</strong> (${c} søvncyklusser)${badge}</li>`;
    });
    html += `</ul>`;

  } else {
    // Går i seng nu
    let now = new Date();
    let startTime = new Date(now.getTime() + latency * 60000);

    html += `<p style="margin-bottom: 10px;">Hvis du lægger dig til at sove nu (og bruger ${latency} min. på at falde i søvn), bør du sætte vækkeuret til et af følgende tidspunkter:</p><ul>`;

    const cycles = [3, 4, 5, 6];
    cycles.forEach(c => {
      let wakeTime = new Date(startTime.getTime() + (c * cycleMinutes) * 60000);
      let timeStr = wakeTime.toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });
      let badge = '';

      if (c === 5) badge = ' <span style="background: #28a745; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8em;">Anbefalet (7,5 t)</span>';
      if (c === 6) badge = ' <span style="background: #17a2b8; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8em;">Lang søvn (9 t)</span>';
      if (c === 4) badge = ' <span style="background: #ffc107; color: black; padding: 2px 6px; border-radius: 4px; font-size: 0.8em;">Kort søvn (6 t)</span>';

      html += `<li style="margin-bottom: 8px;">Kl. <strong>${timeStr}</strong> (${c} søvncyklusser)${badge}</li>`;
    });
    html += `</ul>`;
  }

  resultsDiv.innerHTML = html;
}

// Kør ved indlæsning
document.addEventListener('DOMContentLoaded', calculateSleep);
</script>
