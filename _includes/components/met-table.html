<style>
  .mp-met-table-wrapper {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 1.25rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.03);
    margin: 1.5rem 0;
  }

  /* Søgefelt */
  .mp-met-table-search {
    width: 100%;
    height: 46px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    padding: 0 14px;
    font-size: 0.95rem;
    font-weight: 600;
    box-sizing: border-box;
    margin-bottom: 0.85rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .mp-met-table-search:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  /* Filter Pills (Kategori-knapper) */
  .mp-met-pills-container {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }

  .mp-met-pill {
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #cbd5e1;
    border-radius: 20px;
    padding: 0.35rem 0.85rem;
    font-size: 0.775rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }

  .mp-met-pill:hover {
    background: #e2e8f0;
    color: #0f172a;
  }

  .mp-met-pill.is-active {
    background: #2563eb;
    color: #ffffff;
    border-color: #2563eb;
  }

  /* Status linje */
  .mp-met-status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.775rem;
    font-weight: 700;
    color: #64748b;
    margin-bottom: 0.75rem;
    padding: 0 4px;
  }

  /* Tabel Styling */
  .mp-met-table-container {
    overflow-x: auto;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
  }

  .mp-met-data-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 0.875rem;
  }

  .mp-met-data-table th {
    background: #f8fafc;
    color: #334155;
    font-weight: 800;
    padding: 0.75rem 1rem;
    border-bottom: 2px solid #e2e8f0;
    text-transform: uppercase;
    font-size: 0.725rem;
    letter-spacing: 0.04em;
  }

  .mp-met-data-table td {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #f1f5f9;
    color: #1e293b;
    vertical-align: middle;
  }

  .mp-met-data-table tr:last-child td {
    border-bottom: none;
  }

  .mp-met-data-table tr:hover td {
    background: #f0f9ff;
  }

  .mp-met-badge {
    background: #eff6ff;
    color: #2563eb;
    font-weight: 900;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.825rem;
    display: inline-block;
  }

  .mp-met-group-tag {
    background: #f1f5f9;
    color: #64748b;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.725rem;
    text-transform: capitalize;
  }

  /* Vis Flere Knap */
  .mp-met-load-more-btn {
    display: block;
    width: 100%;
    margin-top: 1rem;
    padding: 0.75rem;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    color: #334155;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
  }

  .mp-met-load-more-btn:hover {
    background: #e2e8f0;
    color: #0f172a;
  }
</style>

<div class="mp-met-table-wrapper js-met-table-root">
  
  <!-- Søgefelt -->
  <input type="text" class="mp-met-table-search js-met-search" placeholder="🔍 Søg efter aktivitet eller kategori (fx mountainbike, gang, løb)...">

  <!-- Kategori Filter Pills (Genereres dynamisk eller via liste) -->
  <div class="mp-met-pills-container js-met-pills">
    <button type="button" class="mp-met-pill is-active" data-group="all">Alle aktiviteter</button>
    <button type="button" class="mp-met-pill" data-group="bicycling">🚴‍♂️ Cykling</button>
    <button type="button" class="mp-met-pill" data-group="running">🏃‍♂️ Løb</button>
    <button type="button" class="mp-met-pill" data-group="walking">🚶‍♂️ Gang</button>
    <button type="button" class="mp-met-pill" data-group="conditioning exercise">🏋️‍♂️ Styrke & Fit</button>
    <button type="button" class="mp-met-pill" data-group="sports">⚽ Sport & Spil</button>
    <button type="button" class="mp-met-pill" data-group="water activities">🏊‍♂️ Svømning & Vand</button>
    <button type="button" class="mp-met-pill" data-group="home activities">🏠 Hus & Have</button>
  </div>

  <!-- Status Bar -->
  <div class="mp-met-status-bar">
    <span class="js-met-count">Henter MET-database...</span>
    <span class="js-met-filter-label" style="color: #2563eb;">Kategori: Alle</span>
  </div>

  <!-- Tabel -->
  <div class="mp-met-table-container">
    <table class="mp-met-data-table">
      <thead>
        <tr>
          <th style="width: 20%;">Kategori</th>
          <th style="width: 65%;">Aktivitet</th>
          <th style="width: 15%; text-align: right;">MET</th>
        </tr>
      </thead>
      <tbody class="js-met-tbody">
        <tr>
          <td colspan="3" style="text-align: center; padding: 2rem; color: #64748b;">Indlæser data...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Vis Flere Knap -->
  <button type="button" class="mp-met-load-more-btn js-met-load-more" style="display: none;">
    Vis flere aktiviteter ⬇️
  </button>

</div>

<script type="module">
  import { initMetTable } from '/assets/js/components/met-table.js';
  document.addEventListener('DOMContentLoaded', () => {
    initMetTable(document.querySelector('.js-met-table-root'));
  });
</script>
