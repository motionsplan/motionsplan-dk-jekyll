<div class="walking-calc-widget">
  <!-- FANER: SKIFT MELLEM SKRIDT OG DISTANCE -->
  <div class="calc-tab-header">
    <button type="button" class="calc-tab-btn active" data-mode="steps">
      <i class="fas fa-shoe-prints"></i> Beregn ud fra skridt
    </button>
    <button type="button" class="calc-tab-btn" data-mode="distance">
      <i class="fas fa-route"></i> Beregn ud fra kilometer
    </button>
  </div>

  <div class="calc-card-body">
    <!-- INPUT: SKRIDT (KUN VISES I SKRIDT-TILSTAND) -->
    <div class="calc-field-group field-steps">
      <label for="calc-steps-input">Antal skridt</label>
      <input type="number" id="calc-steps-input" value="10000" min="100" step="500" placeholder="fx 10000">
      <div class="quick-presets">
        <button type="button" class="step-preset-btn" data-steps="2000">2.000</button>
        <button type="button" class="step-preset-btn" data-steps="5000">5.000</button>
        <button type="button" class="step-preset-btn" data-steps="8000">8.000</button>
        <button type="button" class="step-preset-btn active" data-steps="10000">10.000</button>
      </div>
    </div>

    <!-- INPUT: DISTANCE (KUN VISES I DISTANCE-TILSTAND) -->
    <div class="calc-field-group field-distance" style="display: none;">
      <label for="calc-dist-input">Distance (km)</label>
      <input type="number" id="calc-dist-input" value="8.0" min="0.1" step="0.5" placeholder="fx 8.0">
      <div class="quick-presets">
        <button type="button" class="dist-preset-btn" data-dist="1.0">1 km</button>
        <button type="button" class="dist-preset-btn" data-dist="3.0">3 km</button>
        <button type="button" class="dist-preset-btn" data-dist="5.0">5 km</button>
        <button type="button" class="dist-preset-btn active" data-dist="8.0">8 km</button>
        <button type="button" class="dist-preset-btn" data-dist="10.0">10 km</button>
      </div>
    </div>

    <!-- DOUBLE ROW: SKRIDTLÆNGDE & HASTIGHED -->
    <div class="calc-grid-2col">
      <div class="calc-field-group">
        <label for="calc-stride-input">Skridtlængde (cm)</label>
        <input type="number" id="calc-stride-input" value="79" min="30" max="150" placeholder="fx 79">
        <div class="quick-presets">
          <button type="button" class="stride-preset-btn" data-stride="66">Kvinde (66 cm)</button>
          <button type="button" class="stride-preset-btn active" data-stride="79">Mand (79 cm)</button>
        </div>
      </div>
      <div class="calc-field-group">
        <label for="calc-speed-input">Ganghastighed (km/t)</label>
        <input type="number" id="calc-speed-input" value="5.0" min="1.0" max="15.0" step="0.1" placeholder="fx 5.0">
        <div class="quick-presets">
          <button type="button" class="speed-preset-btn" data-speed="3.0">3 km/t</button>
          <button type="button" class="speed-preset-btn active" data-speed="5.0">5 km/t</button>
          <button type="button" class="speed-preset-btn" data-speed="6.0">6 km/t</button>
        </div>
      </div>
    </div>

    <button type="button" id="calc-submit-btn" class="calc-action-btn">Beregn min gangtid</button>

    <!-- RESULTAT BOKSE -->
    <div class="calc-results-wrapper">
      <div class="res-box res-secondary res-box-steps">
        <span class="res-label">Beregnet distance</span>
        <span class="res-val" id="res-val-distance">7,9 km</span>
      </div>
      <div class="res-box res-secondary res-box-distance" style="display: none;">
        <span class="res-label">Beregnet antal skridt</span>
        <span class="res-val" id="res-val-steps">10.127 skridt</span>
      </div>
      <div class="res-box res-primary">
        <span class="res-label">Forventet tidsforbrug</span>
        <span class="res-val" id="res-val-time">1 t 35 min <small>(95 min)</small></span>
      </div>
    </div>
  </div>
</div>

<style>
.walking-calc-widget {
  background: #ffffff;
  border: 1px solid #cbd5e1;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
  margin: 1.5rem 0;
  font-family: system-ui, -apple-system, sans-serif;
}

/* FANER */
.calc-tab-header {
  display: flex;
  background: #f1f5f9;
  border-bottom: 1px solid #cbd5e1;
}

.calc-tab-btn {
  flex: 1;
  padding: 12px 16px;
  background: none;
  border: none;
  font-size: 0.92rem;
  font-weight: 600;
  color: #64748b;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.calc-tab-btn:hover {
  color: #1e293b;
  background: #e2e8f0;
}

.calc-tab-btn.active {
  background: #ffffff;
  color: #2563eb;
  border-bottom: 2px solid #2563eb;
}

/* BODY & INPUTS */
.calc-card-body {
  padding: 20px;
}

.calc-field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.calc-field-group label {
  font-size: 0.88rem;
  font-weight: 700;
  color: #334155;
}

.calc-field-group input {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 1rem;
  color: #0f172a;
  background: #f8fafc;
  box-sizing: border-box;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.calc-field-group input:focus {
  outline: none;
  border-color: #2563eb;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

.calc-grid-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 540px) {
  .calc-grid-2col {
    grid-template-columns: 1fr;
  }
}

/* HURTIG-PRESETS */
.quick-presets {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.step-preset-btn,
.dist-preset-btn,
.stride-preset-btn,
.speed-preset-btn {
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  border-radius: 16px;
  padding: 4px 10px;
  font-size: 0.8rem;
  font-weight: 600;
  color: #475569;
  cursor: pointer;
  transition: all 0.2s ease;
}

.step-preset-btn:hover,
.dist-preset-btn:hover,
.stride-preset-btn:hover,
.speed-preset-btn:hover {
  background: #e2e8f0;
  color: #0f172a;
}

.step-preset-btn.active,
.dist-preset-btn.active,
.stride-preset-btn.active,
.speed-preset-btn.active {
  background: #2563eb;
  border-color: #2563eb;
  color: #ffffff;
}

/* KNAP */
.calc-action-btn {
  width: 100%;
  height: 46px;
  background: #2563eb;
  color: #ffffff;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
  margin-top: 6px;
  margin-bottom: 16px;
}

.calc-action-btn:hover {
  background: #1d4ed8;
}

/* RESULTATER */
.calc-results-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 500px) {
  .calc-results-wrapper {
    grid-template-columns: 1fr;
  }
}

.res-box {
  padding: 14px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.res-secondary {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
}

.res-primary {
  background: #eff6ff;
  border: 1px solid #bfdbfe;
}

.res-label {
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #64748b;
}

.res-primary .res-label {
  color: #1e40af;
}

.res-val {
  font-size: 1.25rem;
  font-weight: 800;
  color: #0f172a;
}

.res-primary .res-val {
  color: #1e3a8a;
}

.res-val small {
  font-size: 0.85rem;
  font-weight: 500;
  color: #475569;
}
</style>

<script>
(function() {
  const widget = document.querySelector('.walking-calc-widget');
  if (!widget) return;

  const tabBtns = widget.querySelectorAll('.calc-tab-btn');
  const fieldSteps = widget.querySelector('.field-steps');
  const fieldDist = widget.querySelector('.field-distance');
  
  const stepsInput = widget.querySelector('#calc-steps-input');
  const distInput = widget.querySelector('#calc-dist-input');
  const strideInput = widget.querySelector('#calc-stride-input');
  const speedInput = widget.querySelector('#calc-speed-input');
  
  const stepPresetBtns = widget.querySelectorAll('.step-preset-btn');
  const distPresetBtns = widget.querySelectorAll('.dist-preset-btn');
  const stridePresetBtns = widget.querySelectorAll('.stride-preset-btn');
  const speedPresetBtns = widget.querySelectorAll('.speed-preset-btn');
  const calcBtn = widget.querySelector('#calc-submit-btn');

  const boxStepsRes = widget.querySelector('.res-box-steps');
  const boxDistRes = widget.querySelector('.res-box-distance');
  
  const resDistVal = widget.querySelector('#res-val-distance');
  const resStepsVal = widget.querySelector('#res-val-steps');
  const resTimeVal = widget.querySelector('#res-val-time');

  let currentMode = 'steps';

  function calculate() {
    const strideCm = parseFloat(strideInput.value) || 79;
    const speedKmH = parseFloat(speedInput.value) || 5.0;
    
    let distanceKm = 0;

    if (currentMode === 'steps') {
      const steps = parseFloat(stepsInput.value) || 0;
      distanceKm = (steps * (strideCm / 100)) / 1000;
      resDistVal.textContent = distanceKm.toLocaleString('da-DK', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' km';
    } else {
      distanceKm = parseFloat(distInput.value) || 0;
      const calculatedSteps = Math.round((distanceKm * 1000) / (strideCm / 100));
      resStepsVal.textContent = calculatedSteps.toLocaleString('da-DK') + ' skridt';
    }

    if (speedKmH > 0 && distanceKm > 0) {
      const totalHours = distanceKm / speedKmH;
      const totalMinutes = Math.round(totalHours * 60);
      const hours = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;

      if (hours > 0) {
        resTimeVal.innerHTML = `${hours} t ${mins} min <small>(${totalMinutes} min)</small>`;
      } else {
        resTimeVal.innerHTML = `${totalMinutes} min`;
      }
    } else {
      resTimeVal.textContent = '-';
    }
  }

  // Skift Fane Mode
  tabBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      tabBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');

      currentMode = this.getAttribute('data-mode');

      if (currentMode === 'steps') {
        fieldSteps.style.display = 'flex';
        fieldDist.style.display = 'none';
        boxStepsRes.style.display = 'flex';
        boxDistRes.style.display = 'none';
      } else {
        fieldSteps.style.display = 'none';
        fieldDist.style.display = 'flex';
        boxStepsRes.style.display = 'none';
        boxDistRes.style.display = 'flex';
      }
      calculate();
    });
  });

  // Skridt Presets
  stepPresetBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      stepPresetBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      stepsInput.value = this.getAttribute('data-steps');
      calculate();
    });
  });

  // Distance Presets
  distPresetBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      distPresetBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      distInput.value = this.getAttribute('data-dist');
      calculate();
    });
  });

  // Skridtlængde Presets
  stridePresetBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      stridePresetBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      strideInput.value = this.getAttribute('data-stride');
      calculate();
    });
  });

  // Hastighed Presets
  speedPresetBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      speedPresetBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      speedInput.value = this.getAttribute('data-speed');
      calculate();
    });
  });

  // Reager ved manuel ændring i inputs
  stepsInput.addEventListener('input', function() {
    stepPresetBtns.forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-steps') === stepsInput.value);
    });
    calculate();
  });

  distInput.addEventListener('input', function() {
    distPresetBtns.forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-dist') === distInput.value);
    });
    calculate();
  });

  strideInput.addEventListener('input', function() {
    stridePresetBtns.forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-stride') === strideInput.value);
    });
    calculate();
  });

  speedInput.addEventListener('input', function() {
    speedPresetBtns.forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-speed') === speedInput.value);
    });
    calculate();
  });

  if (calcBtn) calcBtn.addEventListener('click', calculate);

  // Kør første beregning ved indlæsning
  calculate();
})();
</script>
