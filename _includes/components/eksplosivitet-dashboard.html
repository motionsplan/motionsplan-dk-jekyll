<div class="mp-db-wrapper" style="max-width: 1000px; margin: 2rem auto; font-family: system-ui, -apple-system, sans-serif;">
  
  <!-- TOPBAR -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; padding: 0 0.25rem; flex-wrap: wrap; gap: 10px;">
    <div>
      <div style="font-size: 1.2rem; font-weight: 800; color: #0f172a;">⚡ Din Eksplosive Profil</div>
      <p style="margin: 0.15rem 0 0 0; font-size: 0.78rem; color: #64748b;">Tilpas dine eksplosivitetstests eller registrer dine seneste hop, sprint og retningsskift.</p>
    </div>
    <div style="display: flex; gap: 8px;">
      <button type="button" class="js-db-add-btn" style="background: #2563eb; color: #ffffff; border: none; border-radius: 8px; padding: 0.45rem 0.85rem; font-size: 0.8rem; font-weight: 800; cursor: pointer;">
        ➕ Tilføj Test
      </button>
      <button type="button" class="js-db-reset-btn" style="background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0.45rem 0.75rem; font-size: 0.8rem; font-weight: 700; color: #64748b; cursor: pointer;">
        🔄 Nulstil
      </button>
    </div>
  </div>

  <!-- GRID -->
  <div class="js-db-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;">
    <!-- Genereres af DashboardManager -->
  </div>

  <!-- MODAL TIL TILFØJELSE AF TESTS -->
  <div class="js-db-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6); z-index: 1000; align-items: center; justify-content: center; padding: 16px;">
    <div style="background: #ffffff; border-radius: 16px; max-width: 580px; width: 100%; height: 520px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);">
      
      <div style="padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; flex-shrink: 0;">
        <div style="font-size: 1.05rem; font-weight: 800; color: #0f172a;">Vælg test til din eksplosive profil</div>
        <button type="button" class="js-modal-close" style="background: #f1f5f9; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 0.85rem;">✖</button>
      </div>

      <div style="display: flex; gap: 6px; padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; overflow-x: auto; flex-shrink: 0;">
        <button type="button" class="js-modal-tab" data-category="all" style="background: #ffffff; border: none; padding: 5px 12px; font-size: 0.78rem; font-weight: 700; color: #0f172a; border-radius: 6px; cursor: pointer;">Alle</button>
        <button type="button" class="js-modal-tab" data-category="Vertikal" style="background: transparent; border: none; padding: 5px 12px; font-size: 0.78rem; font-weight: 700; color: #64748b; border-radius: 6px; cursor: pointer;">Vertikal</button>
        <button type="button" class="js-modal-tab" data-category="Horisontal" style="background: transparent; border: none; padding: 5px 12px; font-size: 0.78rem; font-weight: 700; color: #64748b; border-radius: 6px; cursor: pointer;">Horisontal</button>
        <button type="button" class="js-modal-tab" data-category="Sprint" style="background: transparent; border: none; padding: 5px 12px; font-size: 0.78rem; font-weight: 700; color: #64748b; border-radius: 6px; cursor: pointer;">Sprint</button>
        <button type="button" class="js-modal-tab" data-category="Retningsskift" style="background: transparent; border: none; padding: 5px 12px; font-size: 0.78rem; font-weight: 700; color: #64748b; border-radius: 6px; cursor: pointer;">Retningsskift</button>
      </div>

      <div class="js-modal-test-list" style="padding: 16px 20px; overflow-y: auto; flex: 1;">
        <!-- Genereres dynamisk -->
      </div>

    </div>
  </div>

</div>

<script type="module">
import { DashboardManager } from '/assets/js/core/DashboardManager.js';

export const EKSPLOSIVITET_LIBRARY = {
{%- assign first_item = true -%}
{%- assign all_items = site.posts | concat: site.pages -%}
{%- assign items_with_tests = all_items | where_exp: "item", "item.tags contains 'eksplosivitet'" | where_exp: "item", "item.tests != nil" -%}
{%- for item in items_with_tests -%}
  {%- for test in item.tests -%}
    {%- assign key = test.storage_key -%}
    {%- if key != nil and key != "" -%}
      {%- unless first_item %},{%- endunless %}
  '{{ test.id }}': {
    title: {{ test.title | jsonify }},
    icon: {{ test.icon | jsonify }},
    badge: {{ test.badge | jsonify }},
    tag: '{{ test.icon }} {{ test.badge }}',
    category: {{ test.category | jsonify }},
    unit: {{ test.unit | default: "ml/kg/min" | jsonify }},
    url: {{ item.url | jsonify }},
    desc: {{ test.description | jsonify }},
    storageKey: {{ key | replace: "mp_log_", "" | jsonify }},
    allowQuickLog: {{ test.allow_quick_log | default: false }}
  }
      {%- assign first_item = false -%}
    {%- endif -%}
  {%- endfor -%}
{%- endfor %}
};

document.addEventListener('DOMContentLoaded', () => {
  DashboardManager.initGrid({
    gridSelector: '.js-db-grid',
    library: EKSPLOSIVITET_LIBRARY,
    defaultCards: ['countermovement-jump', 'abalakov-cmj', 'jump-reach-abalakov-1h', 'jump-reach-run-left-1h', 'jump-reach-run-right-1h', 'broad-jump', 'sprint-5m', 'sprint-25-30m', 'sprint-30m', 'pro-agility-5-10-5'],
    configStorageKey: 'mp_eksplosivitet_dashboard_cards',
    resetBtnSelector: '.js-db-reset-btn',
    addBtnSelector: '.js-db-add-btn',
    modalSelector: '.js-db-modal'
  });
});
</script>
