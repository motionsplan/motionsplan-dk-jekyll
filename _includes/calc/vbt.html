{% assign calc_title = include.title | default: "⚡ VBT 1RM Profilering" %}

<div class="mp-calc-card vbt-premium-card" data-calculator="vbt">
  <div class="mp-calc-header vbt-header-spacing">
    <h3 class="mp-calc-title">{{ calc_title }}</h3>
  </div>

  <div class="vbt-container">
    
    <!-- Top Indstillinger -->
    <div class="vbt-top-grid">
      <div class="mp-form-group">
        <label for="vbt-exercise" class="vbt-premium-label">🏋️‍♂️ Øvelse</label>
        <div class="vbt-select-wrapper">
          <select id="vbt-exercise" class="vbt-input-mega">
            <option value="bench">Bænkpres (0.15 m/s)</option>
            <option value="squat">Squat (0.30 m/s)</option>
            <option value="deadlift">Dødløft (0.15 m/s)</option>
            <option value="custom">Brugerdefineret</option>
          </select>
        </div>
      </div>

      <div class="mp-form-group">
        <label for="vbt-mvt" class="vbt-premium-label">🎯 Estimeret MVT (m/s)</label>
        <div class="vbt-input-with-lock">
          <input type="number" step="0.01" id="vbt-mvt" class="vbt-input-mega" value="0.15" disabled>
          <button type="button" id="vbt-mvt-lock-btn" class="vbt-lock-inside-btn" title="Lås op for at redigere">🔒</button>
        </div>
      </div>
    </div>

    <!-- Tabel over forsøg (GEM-tekst fjernet) -->
    <div class="vbt-table-container">
      <table class="vbt-premium-table">
        <thead>
          <tr>
            <th style="width: 35px; text-align: center;">#</th>
            <th>Vægt (kg)</th>
            <th>Hastighed (m/s)</th>
            <th style="width: 48px;"></th> <!-- Tom overskrift i stedet for GEM -->
          </tr>
        </thead>
        <tbody id="vbt-attempts-list">
          <!-- Dynamiske rækker -->
        </tbody>
      </table>
    </div>

    <!-- Handlingsknapper -->
    <div class="vbt-action-bar">
      <button type="button" class="vbt-btn-add-modern" id="vbt-add-attempt-btn">
        <span class="vbt-icon-plus">+</span> Tilføj forsøg
      </button>
      <button type="button" class="vbt-btn-reset-modern" id="vbt-reset-btn">
        ↺ Start forfra
      </button>
    </div>

    <!-- Vejledning -->
    <div id="vbt-guidance-box" class="vbt-guidance-premium mp-guidance-info">
      <span class="vbt-info-icon">💡</span>
      <div class="vbt-info-text">Indtast mindst 2 forsøg for at danne profil og beregne e1RM.</div>
    </div>

    <!-- Graf i FULD bredde -->
    <div class="vbt-chart-full-wrapper">
      <div id="vbt-chart-container" class="vbt-chart-premium-box">
        
        <!-- Floating 1RM Overlay -->
        <div class="vbt-chart-overlay-1rm">
          <div class="vbt-overlay-label">ESTIMERET 1RM</div>
          <div class="vbt-overlay-val"><span data-result="e1rm">0</span> <small>kg</small></div>
          <div class="vbt-overlay-r2">R² = <span data-result="r2">0.00</span></div>
        </div>

        <div id="vbt-svg-wrapper"></div>
      </div>
    </div>

  </div>
</div>
