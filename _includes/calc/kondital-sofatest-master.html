        <div style="font-size: 0.72rem; color: #64748b; line-height: 1.3; margin-bottom: 4px;">Kræver både hvilepuls & maxpuls.</div>

          </div>
        </div>

        <!-- Fysiologisk Fitnessalder -->
        <div style="flex: 1; padding: 0.75rem 1rem; border: 1px solid #bfdbfe; border-radius: 10px; background: #eff6ff; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;">
          <div>
            <div style="font-weight: 800; font-size: 0.85rem; color: #1e40af; line-height: 1.2;">Fysiologisk<br>Fitnessalder</div>
          </div>
          <div style="text-align: right; line-height: 1;">
            <div class="js-kt-fitness-age" style="font-weight: 900; font-size: 1.5rem; color: #1e3a8a;">--</div>
            <div style="font-size: 0.65rem; color: #3b82f6; font-weight: 700; margin-top: 2px;">år</div>
          </div>
        </div>

      </div>
    </div>

    <!-- Popup-tabel -->
    <div class="js-kt-popup" style="display: none; position: absolute !important; top: 0; bottom: 0; left: 0; right: 0; background: #ffffff; z-index: 30; padding: 1rem 1.25rem; box-sizing: border-box; border-radius: 10px; border: 1px solid #cbd5e1; flex-direction: column; align-items: stretch; justify-content: flex-start; overflow-y: auto; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; border-bottom: 1.5px solid #e2e8f0; padding-bottom: 0.4rem; flex-shrink: 0;">
        <h4 style="margin: 0; color: #0f172a; font-size: 0.95rem; font-weight: 800;">Kondital for din alder</h4>
        <button type="button" class="js-kt-popup-close" style="background: none; border: none; font-size: 1.6rem; line-height: 1; cursor: pointer; color: #64748b; padding: 0;">&times;</button>
      </div>

      <div style="flex: 1; overflow-y: auto;">
        <table style="width: 100%; border-collapse: collapse; background: #ffffff; font-size: 0.8rem;">
          <tbody class="js-kt-table-body">
            <!-- Udfyldes af JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Forklaringsboks i bunden -->
  <div class="js-kt-mode-info" style="background: #f8fafc; border-left: 3px solid #2563eb; padding: 0.6rem 0.85rem; border-radius: 0 6px 6px 0; margin-bottom: 1rem; font-size: 0.78rem; color: #334155; line-height: 1.45;">
    <!-- Indsættes dynamisk af JS -->
  </div>

  <!-- Action knapper -->
  <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;" data-html2canvas-ignore="true">
    <button type="button" class="js-download-btn" style="flex: 1; padding: 0.6rem; border: none; border-radius: 6px; background: #2563eb; color: #ffffff; font-weight: 700; font-size: 0.85rem; cursor: pointer;">📸 Tag billede</button>
    <button type="button" class="js-reset-btn" style="width: 42px; padding: 0; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; font-size: 1rem; cursor: pointer;" title="Ryd felter">🗑️</button>
  </div>
  
  <div style="text-align: center; font-size: 0.7rem; color: #94a3b8; font-weight: 600;">&copy; motionsplan.dk</div>

</div>

<script>
(function() {
  const container = document.querySelector('[data-calculator="kondital-master"]');
  if (!container) return;

  const STORAGE_KEY = 'mp_kondital_master_data';
  let currentMode = 'tokmakidis';
  let computedScores = { tokmakidis: null, uth: null, nes: null, jackson: null };

  const modeInfos = {
    tokmakidis: '<strong>Tokmakidis et al. (1987):</strong> Beregner dit reelle fysiologiske kondital ud fra din løbehastighed på en all-out løbetur. Formlen er valideret på distancer fra 1,5 km til 42,2 km.',
    uth: '<strong>Uth et al. (2004):</strong> Estimerer din VO₂max ud fra forholdet mellem din hvilepuls og din makspuls (Heart Rate Ratio Method). Præcision: ± 4,9 ml/kg/min.',
    nes: '<strong>Nes et al. (2011) / HUNT:</strong> Norsk forskningsmodel baseret på data fra over 37.000 deltagere. Tager højde for taljemål, hvilepuls og træningsmængde.',
    jackson: '<strong>Jackson et al. (1990) / NASA:</strong> Non-exercise model udviklet for NASA til hurtig vurdering af kondital ud fra BMI og NASA\'s PAR-aktivitetsskala (0-7).'
  };

  // UI Elementer
  const modeBtns = container.querySelectorAll('.js-kt-mode-btn');
  const sections = container.querySelectorAll('.js-kt-section');
  const inputs = container.querySelectorAll('.js-kt-input');
  const pills = container.querySelectorAll('.js-kt-pill');
  const infoBox = container.querySelector('.js-kt-mode-info');
  
  const displayFitness = container.querySelector('.js-kt-fitness');
  const displayVo2max = container.querySelector('.js-kt-vo2max');
  const displayFitnessAge = container.querySelector('.js-kt-fitness-age');
  const displaySdText = container.querySelector('.js-kt-sd-text');
  const marker = container.querySelector('.js-kt-continuum-marker');
  
  const evalBadge = container.querySelector('.js-kt-eval-badge');
  const evalText = container.querySelector('.js-kt-eval-text');
  const popup = container.querySelector('.js-kt-popup');
  const popupClose = container.querySelector('.js-kt-popup-close');
  const tableBody = container.querySelector('.js-kt-table-body');
  
  const estimateBtn = container.querySelector('.js-kt-estimate-btn');
  const maxHrHelper = container.querySelector('.js-kt-maxhr-helper');

  // Helper til vurderingsfarver
  function getEvalCategory(score, gender) {
    if (!score || score <= 0) return { cat: 'Mangler data', color: '#cbd5e1', textColor: '#475569' };
    const cutoffs = (gender === 'male') 
      ? { low: 35, mid: 44, high: 52, vhigh: 57 }
      : { low: 28, mid: 35, high: 44, vhigh: 49 };

    if (score < cutoffs.low) return { cat: 'Lav', color: '#ef4444', textColor: '#ffffff' };
    if (score < cutoffs.mid) return { cat: 'Under middel', color: '#f97316', textColor: '#ffffff' };
    if (score < cutoffs.high) return { cat: 'Middel', color: '#eab308', textColor: '#ffffff' };
    if (score < cutoffs.vhigh) return { cat: 'Høj', color: '#22c55e', textColor: '#ffffff' };
    return { cat: 'Meget høj', color: '#2563eb', textColor: '#ffffff' };
  }

  // Skift Mode
  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      currentMode = btn.dataset.mode;
      modeBtns.forEach(b => {
        b.style.border = '2px solid #e2e8f0';
        b.style.background = '#ffffff';
        b.classList.remove('is-active');
      });
      btn.style.border = '2px solid #2563eb';
      btn.style.background = '#eff6ff';
      btn.classList.add('is-active');

      sections.forEach(sec => {
        sec.style.display = (sec.dataset.section === currentMode) ? 'block' : 'none';
      });

      infoBox.innerHTML = modeInfos[currentMode];
      calculateAll();
    });
  });

  // Køn toggle
  const genderBtns = container.querySelectorAll('.js-kt-gender-btn');
  genderBtns.forEach(btn => {
    btn.parentElement.querySelector('input').addEventListener('change', (e) => {
      genderBtns.forEach(b => {
        b.style.background = '#f8fafc';
        b.style.color = '#475569';
      });
      if (e.target.checked) {
        btn.style.background = '#2563eb';
        btn.style.color = '#ffffff';
      }
      calculateAll();
    });
  });

  // Pill knapper (Aktivitet)
  pills.forEach(pill => {
    btn = pill;
    btn.addEventListener('click', () => {
      const group = btn.closest('.js-kt-pill-group');
      group.querySelectorAll('.js-kt-pill').forEach(p => {
        p.style.border = '1.5px solid #cbd5e1';
        p.style.background = '#ffffff';
        p.style.color = '#0f172a';
        p.style.fontWeight = 'normal';
        p.classList.remove('is-active');
      });
      btn.style.border = '2px solid #2563eb';
      btn.style.background = '#eff6ff';
      btn.style.color = '#1e40af';
      btn.style.fontWeight = '700';
      btn.classList.add('is-active');
      calculateAll();
    });
  });

  // Maxpuls estimering (Tanaka 2001)
  if (estimateBtn) {
    estimateBtn.addEventListener('click', () => {
      const ageInput = container.querySelector('[name="kt_age"]');
      const maxHrInput = container.querySelector('[name="kt_maxhr"]');
      const age = parseFloat(ageInput.value);
      if (age && age >= 10 && age <= 100) {
        const estMax = Math.round(208 - (0.7 * age));
        maxHrInput.value = estMax;
        if (maxHrHelper) maxHrHelper.style.display = 'block';
        calculateAll();
      }
    });
  }

  // Input ændringer
  inputs.forEach(input => {
    input.addEventListener('input', calculateAll);
  });

  // Popup tabel
  if (evalBadge) evalBadge.addEventListener('click', () => popup.style.display = 'flex');
  if (popupClose) popupClose.addEventListener('click', () => popup.style.display = 'none');

  // LOCAL STORAGE FUNKTIONER
  function saveToLocalStorage() {
    const nesPill = container.querySelector('[data-name="kt_nes_pa"] .js-kt-pill.is-active');
    const jackPill = container.querySelector('[data-name="kt_jackson_par"] .js-kt-pill.is-active');
    
    const data = {
      mode: currentMode,
      age: container.querySelector('[name="kt_age"]').value,
      weight: container.querySelector('[name="kt_weight"]').value,
      gender: container.querySelector('[name="kt_gender"]:checked')?.value || 'male',
      tok_dist: container.querySelector('[name="kt_tok_dist"]').value,
      tok_min: container.querySelector('[name="kt_tok_min"]').value,
      tok_sec: container.querySelector('[name="kt_tok_sec"]').value,
      resthr: container.querySelector('[name="kt_resthr"]').value,
      maxhr: container.querySelector('[name="kt_maxhr"]').value,
      waist: container.querySelector('[name="kt_waist"]').value,
      nes_resthr: container.querySelector('[name="kt_nes_resthr"]').value,
      nes_pa: nesPill ? nesPill.dataset.value : '3',
      height: container.querySelector('[name="kt_height"]').value,
      jackson_par: jackPill ? jackPill.dataset.value : '4'
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function loadFromLocalStorage() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    try {
      const data = JSON.parse(saved);
      if (data.age) container.querySelector('[name="kt_age"]').value = data.age;
      if (data.weight) container.querySelector('[name="kt_weight"]').value = data.weight;
      if (data.tok_dist) container.querySelector('[name="kt_tok_dist"]').value = data.tok_dist;
      if (data.tok_min) container.querySelector('[name="kt_tok_min"]').value = data.tok_min;
      if (data.tok_sec) container.querySelector('[name="kt_tok_sec"]').value = data.tok_sec;
      if (data.resthr) container.querySelector('[name="kt_resthr"]').value = data.resthr;
      if (data.maxhr) container.querySelector('[name="kt_maxhr"]').value = data.maxhr;
      if (data.waist) container.querySelector('[name="kt_waist"]').value = data.waist;
      if (data.nes_resthr) container.querySelector('[name="kt_nes_resthr"]').value = data.nes_resthr;
      if (data.height) container.querySelector('[name="kt_height"]').value = data.height;

      // Køn
      if (data.gender) {
        const radio = container.querySelector(`[name="kt_gender"][value="${data.gender}"]`);
        if (radio) {
          radio.checked = true;
          genderBtns.forEach(b => {
            b.style.background = '#f8fafc';
            b.style.color = '#475569';
          });
          const activeBtn = radio.parentElement.querySelector('.js-kt-gender-btn');
          if (activeBtn) {
            activeBtn.style.background = '#2563eb';
            activeBtn.style.color = '#ffffff';
          }
        }
      }

      // NES Pill
      if (data.nes_pa) {
        const nesGroup = container.querySelector('[data-name="kt_nes_pa"]');
        if (nesGroup) {
          nesGroup.querySelectorAll('.js-kt-pill').forEach(p => {
            p.classList.remove('is-active');
            p.style.border = '1.5px solid #cbd5e1';
            p.style.background = '#ffffff';
            p.style.color = '#0f172a';
            p.style.fontWeight = 'normal';
            if (p.dataset.value === String(data.nes_pa)) {
              p.classList.add('is-active');
              p.style.border = '2px solid #2563eb';
              p.style.background = '#eff6ff';
              p.style.color = '#1e40af';
              p.style.fontWeight = '700';
            }
          });
        }
      }

      // Jackson Pill
      if (data.jackson_par) {
        const jackGroup = container.querySelector('[data-name="kt_jackson_par"]');
        if (jackGroup) {
          jackGroup.querySelectorAll('.js-kt-pill').forEach(p => {
            p.classList.remove('is-active');
            p.style.border = '1.5px solid #cbd5e1';
            p.style.background = '#ffffff';
            p.style.color = '#0f172a';
            p.style.fontWeight = 'normal';
            if (p.dataset.value === String(data.jackson_par)) {
              p.classList.add('is-active');
              p.style.border = '2px solid #2563eb';
              p.style.background = '#eff6ff';
              p.style.color = '#1e40af';
              p.style.fontWeight = '700';
            }
          });
        }
      }

      // Tilstand (Mode)
      if (data.mode) {
        const targetBtn = container.querySelector(`.js-kt-mode-btn[data-mode="${data.mode}"]`);
        if (targetBtn) {
          currentMode = data.mode;
          modeBtns.forEach(b => {
            b.style.border = '2px solid #e2e8f0';
            b.style.background = '#ffffff';
            b.classList.remove('is-active');
          });
          targetBtn.style.border = '2px solid #2563eb';
          targetBtn.style.background = '#eff6ff';
          targetBtn.classList.add('is-active');
          sections.forEach(sec => {
            sec.style.display = (sec.dataset.section === currentMode) ? 'block' : 'none';
          });
        }
      }
    } catch(e) {
      console.warn('Fejl ved indlæsning af gemte kondital-data', e);
    }
  }

  // Hoved-beregning for alle 4 modeller
  function calculateAll() {
    const ageInput = container.querySelector('[name="kt_age"]');
    const weightInput = container.querySelector('[name="kt_weight"]');
    const genderInput = container.querySelector('[name="kt_gender"]:checked');

    const age = parseFloat(ageInput ? ageInput.value : 40) || 40;
    const weight = parseFloat(weightInput ? weightInput.value : 80) || 80;
    const gender = genderInput ? genderInput.value : 'male';

    // 1. Tokmakidis (Løbetur)
    const dist = parseFloat(container.querySelector('[name="kt_tok_dist"]').value);
    const min = parseFloat(container.querySelector('[name="kt_tok_min"]').value);
    const sec = parseFloat(container.querySelector('[name="kt_tok_sec"]').value) || 0;
    if (dist && min && dist >= 1.5) {
      const timeInMin = min + (sec / 60);
      const speedKmH = dist / (timeInMin / 60);
      const met = 3.1747 + (0.9139 * speedKmH);
      computedScores.tokmakidis = met * 3.5;
    } else {
      computedScores.tokmakidis = null;
    }

    // 2. Uth (Puls)
    const restHr = parseFloat(container.querySelector('[name="kt_resthr"]').value);
    const maxHr = parseFloat(container.querySelector('[name="kt_maxhr"]').value);
    if (restHr && maxHr && maxHr > restHr) {
      computedScores.uth = 15.3 * (maxHr / restHr);
    } else {
      computedScores.uth = null;
    }

    // 3. Nes (HUNT)
    const waist = parseFloat(container.querySelector('[name="kt_waist"]').value);
    const nesRestHr = parseFloat(container.querySelector('[name="kt_nes_resthr"]').value);
    const nesPill = container.querySelector('[data-name="kt_nes_pa"] .js-kt-pill.is-active');
    const nesPa = nesPill ? parseFloat(nesPill.dataset.value) : 3;
    if (waist && nesRestHr) {
      const paScoreMap = { 1: 0, 2: 0.6, 3: 1.5, 4: 2.2 };
      const paVal = paScoreMap[nesPa] || 1.5;
      if (gender === 'male') {
        computedScores.nes = 100.27 - (0.296 * age) - (0.369 * waist) - (0.155 * nesRestHr) + (0.226 * paVal * 10);
      } else {
        computedScores.nes = 74.74 - (0.247 * age) - (0.259 * waist) - (0.114 * nesRestHr) + (0.198 * paVal * 10);
      }
    } else {
      computedScores.nes = null;
    }

    // 4. Jackson (NASA)
    const height = parseFloat(container.querySelector('[name="kt_height"]').value);
    const jackPill = container.querySelector('[data-name="kt_jackson_par"] .js-kt-pill.is-active');
    const par = jackPill ? parseFloat(jackPill.dataset.value) : 4;
    if (height && weight) {
      const bmi = weight / Math.pow(height / 100, 2);
      const genderVal = (gender === 'male') ? 1 : 0;
      computedScores.jackson = 56.363 + (1.921 * par) - (0.381 * age) - (0.754 * bmi) + (10.887 * genderVal) - 10.887 * (1 - genderVal) / 2;
    } else {
      computedScores.jackson = null;
    }

    // Opdater Dashboard Badges i toppen
    Object.keys(computedScores).forEach(mode => {
      const badge = container.querySelector(`.js-kt-card-badge[data-badge="${mode}"]`);
      const score = computedScores[mode];
      if (badge) {
        if (score && score > 0) {
          const evalRes = getEvalCategory(score, gender);
          badge.textContent = score.toFixed(1);
          badge.style.background = evalRes.color;
          badge.style.color = evalRes.textColor;
        } else {
          badge.textContent = '-';
          badge.style.background = '#cbd5e1';
          badge.style.color = '#475569';
        }
      }
    });

    // Opdater Hovedresultat for AKTIV mode
    const activeScore = computedScores[currentMode];
    if (activeScore && activeScore > 0) {
      displayFitness.textContent = activeScore.toFixed(1);
      
      const vo2Abs = (activeScore * weight) / 1000;
      displayVo2max.textContent = vo2Abs.toFixed(2);

      // Fitnessalder
      const baseAgeScore = (gender === 'male') ? (52 - (0.35 * age)) : (44 - (0.32 * age));
      const ageDiff = Math.round((baseAgeScore - activeScore) / 0.35);
      const fitnessAge = Math.max(18, Math.min(85, age + ageDiff));
      displayFitnessAge.textContent = fitnessAge;

      // SD tekst
      displaySdText.textContent = (currentMode === 'tokmakidis') ? 'Målt via løbehastighed' : '± 4.9 ml/kg/min';

      // Marker slider (20 - 70 skala)
      const pct = Math.max(0, Math.min(100, ((activeScore - 20) / 50) * 100));
      marker.style.left = pct + '%';
      marker.style.display = 'block';

      // Vurdering & tabel
      updateEvaluation(activeScore, age, gender);
    } else {
      displayFitness.textContent = '-';
      displayVo2max.textContent = '-';
      displayFitnessAge.textContent = '--';
      marker.style.display = 'none';
      evalText.textContent = 'Mangler data';
      evalBadge.style.background = '#e2e8f0';
      evalBadge.style.color = '#64748b';
    }

    saveToLocalStorage();
  }

  function updateEvaluation(score, age, gender) {
    const evalRes = getEvalCategory(score, gender);
    const cat = evalRes.cat;
    const color = evalRes.color;

    evalText.textContent = cat;
    evalBadge.style.background = color;
    evalBadge.style.color = '#ffffff';

    const cutoffs = (gender === 'male') 
      ? { low: 35, mid: 44, high: 52, vhigh: 57 }
      : { low: 28, mid: 35, high: 44, vhigh: 49 };

    // Byg popup tabel
    tableBody.innerHTML = `
      <tr style="border-bottom: 1px solid #e2e8f0;"><td style="padding: 0.4rem; font-weight: 700;">Kategori</td><td style="padding: 0.4rem; font-weight: 700;">Grænse (ml/kg/min)</td></tr>
      <tr style="background: ${cat==='Lav'?'#fee2e2':'transparent'};"><td style="padding: 0.4rem; color: #ef4444; font-weight: 700;">Lav</td><td style="padding: 0.4rem;">< ${cutoffs.low}</td></tr>
      <tr style="background: ${cat==='Under middel'?'#ffedd5':'transparent'};"><td style="padding: 0.4rem; color: #f97316; font-weight: 700;">Under middel</td><td style="padding: 0.4rem;">${cutoffs.low} - ${cutoffs.mid-1}</td></tr>
      <tr style="background: ${cat==='Middel'?'#fef9c3':'transparent'};"><td style="padding: 0.4rem; color: #ca8a04; font-weight: 700;">Middel</td><td style="padding: 0.4rem;">${cutoffs.mid} - ${cutoffs.high-1}</td></tr>
      <tr style="background: ${cat==='Høj'?'#dcfce7':'transparent'};"><td style="padding: 0.4rem; color: #16a34a; font-weight: 700;">Høj</td><td style="padding: 0.4rem;">${cutoffs.high} - ${cutoffs.vhigh-1}</td></tr>
      <tr style="background: ${cat==='Meget høj'?'#dbeafe':'transparent'};"><td style="padding: 0.4rem; color: #2563eb; font-weight: 700;">Meget høj</td><td style="padding: 0.4rem;">> ${cutoffs.vhigh}</td></tr>
    `;
  }

  // Reset knap
  const resetBtn = container.querySelector('.js-reset-btn');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      container.querySelectorAll('input').forEach(i => {
        if (i.type === 'number') i.value = '';
      });
      container.querySelector('[name="kt_age"]').value = 40;
      container.querySelector('[name="kt_weight"]').value = 80;
      if (maxHrHelper) maxHrHelper.style.display = 'none';
      calculateAll();
    });
  }

  // Billede Download
  const downloadBtn = container.querySelector('.js-download-btn');
  if (downloadBtn) {
    downloadBtn.addEventListener('click', () => {
      html2canvas(container, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'kondital-resultat.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    });
  }

  // Initiel kørsel og gemt data
  loadFromLocalStorage();
  infoBox.innerHTML = modeInfos[currentMode];
  calculateAll();
})();
</script>
