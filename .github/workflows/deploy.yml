name: deploy

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
  workflow_dispatch:

env:
  RUBY_VERSION: "3.3.2"
  BUNDLER_VERSION: "2.5.11"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: 🛎 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚡️ Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats build-essential ca-certificates curl make shellcheck libgsl-dev libffi-dev minify liblapacke-dev libopenblas-dev
          sudo gem install bundler:${{ env.BUNDLER_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: ⚡️ Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}

      - name: ⚡️ Install Node dependencies
        run: npm ci || npm install

      - name: Checking Jekyll configuration
        run: bundle exec jekyll doctor

      - name: 🔨 Build site
        run: bundle exec jekyll build --lsi --profile
        env:
          JEKYLL_ENV: production

      - name: Cache Jekyll site
        uses: actions/cache@v4
        with:
          path: "_site/"
          key: ${{ runner.os }}-${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Use cache
        uses: actions/cache@v4
        with:
          path: "_site/"
          key: ${{ runner.os }}-${{ github.sha }}

      - name: 🎉 Deploy to GitHub Pages 🎊
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Use cache
        uses: actions/cache@v4
        with:
          path: "_site/"
          key: ${{ runner.os }}-${{ github.sha }}

      - name: ⚡️ Cache HTMLProofer
        id: cache-htmlproofer
        uses: actions/cache@v4
        with:
          path: tmp/.htmlproofer
          key: ${{ runner.os }}-htmlproofer

      - name: 📉 Check HTML
        uses: chabad360/htmlproofer@master
        with:
          directory: "./_site"
          arguments: |
            --only-4xx
            --ignore-status-codes "400,403,409,429"
            --ignore-empty-alt
            --allow-hash-href
            --no-enforce-https
            --ignore-urls "/bjsm.bmj.com/, /mademistakes.com/, /www.t-nation.com/"