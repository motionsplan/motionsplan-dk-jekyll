name: deploy

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
  workflow_dispatch:

env:
  RUBY_VERSION: "3.3.2"
  BUNDLER_VERSION: "2.5.11"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: 🛎 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚡️ Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats build-essential ca-certificates curl make shellcheck libgsl-dev libffi-dev minify liblapacke-dev libopenblas-dev
          sudo gem install bundler:${{ env.BUNDLER_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: ⚡️ Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}

      - name: ⚡️ Install Node dependencies
        run: npm ci || npm install

      - name: Checking Jekyll configuration
        run: bundle exec jekyll doctor

      - name: 🔨 Build site
        run: bundle exec jekyll build --lsi --profile
        env:
          JEKYLL_ENV: production

      - name: Cache Jekyll site
        uses: actions/cache@v4
        with:
          path: "_site/"
          key: ${{ runner.os }}-${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Use cache
        uses: actions/cache@v4
        with:
          path: "_site/"
          key: ${{ runner.os }}-${{ github.sha }}

      - name: 🎉 Deploy to GitHub Pages 🎊
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Use cache
        uses: actions/cache@v4
        with:
          path: "_site/"
          key: ${{ runner.os }}-${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📉 Check internal links with Linkinator
        run: |
          # 1. Start en lynhurtig statisk webserver i baggrunden (&) for mappen _site
          npx http-server _site -p 4000 &
          
          # 2. Giv serveren 2 sekunder til at boote op
          sleep 2
          
          # 3. Kør Linkinator som en crawler på tværs af hele det lokale site
          # --skip '^http' sikrer, at vi kun tjekker de interne links
          # --recurse sikrer, at den crawler hele sitet fra forsiden
          # --silent sikrer, at du KUN ser fejl/fails i GitHub Actions loggen
          npx linkinator http://localhost:4000 --skip '^http' --recurse --silent