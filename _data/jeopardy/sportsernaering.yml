title: "Sportsernæring"
icon: "⚡"
questions:
  - q: "Denne letfordøjelige frugt regnes for en optimal kulhydratsnack under et hårdt træningspas på 90 minutter."
    a: "Hvad er en moden banan?"
  - q: "De to næringsstoffer, atleter primært bør indtage før og under en vigtig konkurrence."
    a: "Hvad er væske og kulhydrater?"
  - q: "Den anbefalede mængde kulhydrat pr. time ved kontinuerlig konkurrence af 60-90 minutters varighed."
    a: "Hvad er 30 - 60 gram i timen?"
  - q: "Den osmotiske årsag til, at koncentrerede energigels uden nok vand kan fremkalde mavekramper."
    a: "Hvad er, at hypertoniske geler trækker væske ind i tarmen?"
  - q: "Den anbefalede koncentration af natrium (salt) i hydreringsvæske ved længerevarende træning."
    a: "Hvad er mindst 11 - 25 mmol/L (ca. 250 - 575 mg/L)?"