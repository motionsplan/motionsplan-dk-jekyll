title: "Træningsmyter"
icon: "🏋️"
questions:
  - q: "Påstanden om, at man mister smidighed og bevægelighed af at styrketræne."
    a: "Hvad er en myte? (Styrketræning med fuld ROM bevarer eller forbedrer smidigheden)"
  - q: "Dette populære præstationsfremmende tilskud øger ifølge videnskaben beviseligt den maksimale muskelstyrke."
    a: "Hvad er kreatin?"
  - q: "Påstanden om, at lav vægt med mange gentagelser kan give lige så stor muskelvækst (hypertrofi) som tunge vægte, hvis der trænes tæt på udmattelse."
    a: "Hvad er en sandhed?"
  - q: "Mineralet, som over 80 % af fitnessudøvere fejlagtigt tror forebygger almindelige muskelkramper."
    a: "Hvad er magnesium?"
  - q: "Påstanden om, at animalsk protein bygger markant mere muskelmasse end planteprotein, forudsat at total protein og aminosyrer er dækket."
    a: "Hvad er en myte?"