title: "Vægtregulering"
icon: "⚖️"
questions:
  - q: "Næringsstoffet, som indeholder flest kalorier (ca. 9 kcal / 37 kJ) pr. gram."
    a: "Hvad er fedt?"
  - q: "Den primære fysiologiske forudsætning, hvis en atlet ønsker at tabe kropsfedt."
    a: "Hvad er et kalorieunderskud (spise færre kalorier end man forbrænder)?"
  - q: "Tilstanden med kronisk lav energitilgængelighed, der skader knogletæthed, immunforsvar og hormoner."
    a: "Hvad er REDs (Relative Energy Deficiency in Sport)?"
  - q: "Årsagen til, at det ikke reducerer kalorieindtaget at skifte fra smør til margarine."
    a: "Hvad er, at de har omtrent samme høje fedt- og kalorieindhold (~700-750 kcal pr. 100 g)?"
  - q: "Denne type kulhydrater anbefales under vægttab, da de nedbrydes langsommere og giver længere mæthed."
    a: "Hvad er kulhydrater med lavt glykæmisk indeks (lav-GI)?"