title: "Protein & Muskler"
icon: "🥩"
questions:
  - q: "Den procentvise andel af energiforbruget under træning, som protein normalt maksimalt bidrager med."
    a: "Hvad er under 5 %?"
  - q: "Den typiske mængde kvalitetsprotein i et måltid, hvor muskelproteinsyntesen mættes (muscle full-effekten)."
    a: "Hvad er ca. 20 - 40 gram?"
  - q: "Det daglige proteinbehov for en veltrænet styrkeatlet på 100 kg for maksimal muskelvækst."
    a: "Hvad er ca. 150 gram (1,4 - 2,0 g/kg/dag)?"
  - q: "Fødevaren, der indeholder mest protein: 100 g råt kyllingebryst, 2 hele æg eller 30 g mandler."
    a: "Hvad er kyllingebryst (ca. 22-24 g)?"
  - q: "Årsagen til, at linser alene ikke dækker alle kroppens essentielle aminosyrer i fuldt dækkende proportioner."
    a: "Hvad er et lavt indhold af visse essentielle svovlholdige aminosyrer (fx methionin)?"