title: "Piller & Pulver"
icon: "💊"
questions:
  - q: "Dette anabole androgene stof er strengt forbudt af WADA, i modsætning til koffein og bikarbonat."
    a: "Hvad er testosteron?"
  - q: "Koffeins primære virkningsmekanisme i kroppen, som sænker den centrale træthedsfølelse."
    a: "Hvad er blokering af adenosin-receptorer i centralnervesystemet?"
  - q: "Dette tilskud øger musklernes koncentration af carnosin og mindsker syreophobning ved hårdt arbejde på 1-4 minutter."
    a: "Hvad er Beta-alanin?"
  - q: "Den specifikke biomarkør/blodprøve, en læge bør måle for at dokumentere mangel, før der tages jerntilskud."
    a: "Hvad er serum-ferritin?"
  - q: "Dette stof mangler tilstrækkelig videnskabelig evidens for at forbedre præstation, i modsætning til koffein, bikarbonat og leucin."
    a: "Hvad er ferulasyre (Ferulic acid)?"