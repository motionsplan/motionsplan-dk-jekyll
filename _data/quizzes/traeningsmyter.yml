- question: "Man mister smidighed og bevægelighed (flexibility) af at styrketræne."
  options:
    - "Myte"
    - "Sandhed"
  answer: "Myte! Styrketræning reducerer ikke smidigheden. Tværtimod viser forskning (ifølge Unger et al., 2025), at styrketræning med fuld 'range of motion' (ROM) bevarer eller ligefrem forbedrer bevægeligheden i leddene."

- question: "Lav vægt og mange gentagelser (low-load) er lige så effektivt til at bygge maksimal styrke (maximal strength) som tung vægt og få gentagelser (high-load)."
  options:
    - "Myte"
    - "Sandhed"
  answer: "Myte! Hvis målet er ren muskelstyrke, er høj belastning (tunge vægte) overlegen. Lav belastning og høj volumen kan give muskelvækst, men giver et dårligere udbytte på *maksimal styrke* (Unger et al., 2025)."

- question: "Lav vægt og mange gentagelser (low-load) er lige så effektivt til at bygge muskelmasse (hypertrofi) som tung vægt (high-load)."
  options:
    - "Sandhed"
    - "Myte"
  answer: "Sandhed! Forskningen viser, at lette vægte/høj volumen kan give lige så stor hypertrofi som tunge vægte, forudsat at man træner tæt på muskulær udmattelse. Alligevel troede over 50 % af fitnessgængerne i et østrigsk studie, at dette var en myte (Unger et al., 2025)."

- question: "Styrketræning udført med frie vægte er mere effektivt end træning i maskiner, når man vil opbygge muskelmasse og styrke."
  options:
    - "Myte"
    - "Sandhed"
  answer: "Myte! Der er ingen evidens for, at frie vægte generelt er mere effektive til at skabe muskelvækst og styrke end maskiner. Maskiner giver ofte bedre stabilitet, så man kan isolere målmusklen og presse den til udmattelse. Næsten 55 % af de adspurgte fitnessgængere troede fejlagtigt, at dette var sandt (Unger et al., 2025)."

- question: "For at bygge maksimal muskelmasse (hypertrofi) SKAL man træne til absolut 'muscle failure' (muskulær udmattelse)."
  options:
    - "Myte"
    - "Sandhed"
  answer: "Myte! Selvom træning tæt på failure er effektivt for muskelvækst, er *absolut* failure ikke en nødvendighed for at opnå muskelvækst (Unger et al., 2025)."

- question: "Styrketræning udført over 'full range of motion' (fuld bevægebane) er overlegen i forhold til 'partial range of motion' (delvis bevægebane), når det gælder muskelvækst."
  options:
    - "Sandhed"
    - "Myte"
  answer: "Sandhed! For muskelvækst (hypertrofi) viser videnskaben tydeligt, at fuld range of motion er bedre end delvis range of motion. Dette er en af de få kendsgerninger, som flertallet af fitnessgængere faktisk ved (Unger et al., 2025)."

- question: "For at maksimere hypertrofi er man nødt til at træne en muskel flere gange om ugen frem for kun én gang (forudsat at den samlede ugentlige mængde/volumen er den samme)."
  options:
    - "Myte"
    - "Sandhed"
  answer: "Myte! Når den totale ugentlige træningsvolumen holdes ens, viser forskningen ikke nogen væsentlig fordel for muskelvækst ved at fordele mængden på flere dage i forhold til kun én (Unger et al., 2025)."

- question: "Mænd har generelt større relativ fordel af styrketræning end kvinder."
  options:
    - "Myte"
    - "Sandhed"
  answer: "Myte! Næsten 65 % af de adspurgte i et østrigsk studie mente, at styrketræning er mere effektivt for mænd (Unger et al., 2025). Systematiske reviews viser dog, at mænd og kvinder procentuelt oplever lignende gevinster i relativ muskelvækst."
- question: "Proteintilskud øger styrke og muskelvækst (hypertrofi) i forbindelse med styrketræning."
  options:
    - "Sandhed"
    - "Myte"
  answer: "Sandhed! Forskningen (systematiske reviews) bekræfter, at protein fremmer styrke og muskelvækst. Et stort flertal (86,5 %) af de adspurgte fitnessudøvere vidste heldigvis også dette (Unger et al., 2025)."

- question: "Tidspunktet for dit proteinindtag (fx timing lige efter træning) har afgørende betydning for muskelvækst."
  options:
    - "Myte"
    - "Sandhed"
  answer: "Myte! Det samlede daglige proteinindtag er langt vigtigere end den præcise timing omkring selve træningspasset. Alligevel troede 64,4 % af fitnessgængerne, at timing var afgørende (Unger et al., 2025)."

- question: "Animalsk protein (fx kød, mælk og valle) bygger mere muskelmasse end plantebaseret protein."
  options:
    - "Myte"
    - "Sandhed"
  answer: "Myte! Nyere systematiske reviews viser ingen forskel på effekten af planteprotein (fx soja) versus animalsk protein på hypertrofi og styrke, så længe det totale indtag og mængden af essentielle aminosyrer er dækket. Kvinder var i øvrigt signifikant bedre til at gennemskue denne myte end mænd (Unger et al., 2025)."

- question: "Kreatin-tilskud øger muskelstyrken (maximal strength)."
  options:
    - "Sandhed"
    - "Myte"
  answer: "Sandhed! Kreatin er et af de mest veldokumenterede tilskud til at øge styrke. Hele 73,8 % af deltagerne i studiet (især mænd og yngre udøvere) var opmærksomme på denne kendsgerning (Unger et al., 2025)."

- question: "Indtag af kulhydrater (carbohydrates) inden eller under et styrketræningspas øger den akutte præstation."
  options:
    - "Myte"
    - "Sandhed"
  answer: "Myte! Mens kulhydrater er afgørende for udholdenhedssport, viser systematiske reviews, at et akut kulhydratindtag *ikke* øger præstationsevnen under et almindeligt styrketræningspas (fx evnen til at løfte tungere eller flere gentagelser). 74,5 % troede dog fejlagtigt, at det hjalp (Unger et al., 2025)."

- question: "Magnesium-tilskud forebygger muskelkramper i forbindelse med træning."
  options:
    - "Myte"
    - "Sandhed"
  answer: "Myte! Selvom rådet gives ofte, er der ingen stærk videnskabelig evidens for, at magnesium forebygger almindelige muskelkramper (Unger et al., 2025). Hele 82,9 % af fitnessgængerne troede på myten, hvilket gjorde det til studiets mest udbredte misforståelse."