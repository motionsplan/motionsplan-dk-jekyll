- question: "Hvorfor er tungere styrketræning særligt vigtigt for ældre mænd og kvinder?"
  options:
    - "Det modvirker aldersbetinget tab af muskelmasse (sarkopeni) og styrker knogletætheden"
    - "Det øger smidigheden mere end strækøvelser"
    - "Det er den eneste måde at forhindre grå hår på"
  answer: "Med alderen mister vi naturligt muskelmasse og knoglevæv. Styrketræning bremser dette tab effektivt og forebygger faldulykker."

- question: "Må gravide kvinder med en ukompliceret graviditet styrketræne?"
  options:
    - "Ja, regelmæssig og tilpasset styrketræning er sikkert og gavnligt under graviditeten"
    - "Nej, graviditet kræver komplet sengeleje fra 2. trimester"
    - "Kun hvis vægtene ikke overstiger 2 kg"
  answer: "Træning under graviditet forebygger rygsmerter, graviditetssukkersyge og giver en bedre fødselsoplevelse, så længe der lyttes til kroppen."

- question: "Er styrketræning sikkert for børn og unge i vokseværket?"
  options:
    - "Ja, under kyndig vejledning og med fokus på god teknik er det sikkert og styrker knoglerne"
    - "Nej, det stopper altid børns højdevækst"
    - "Kun hvis de udelukkende køre maskintræning"
  answer: "Myten om at styrketræning hæmmer børns vækst er afkræftet. Supervision og hensigtsmæssig progression er nøglen."