# KROPSANALYSE & KROPSSAMMENSÆTNING
# =============================================================================

- q: "Hvor mange procent af kropsvægten udgør skeletmuskelmassen i gennemsnit hos en ung, utrænet kvinde?"
  target_min: 30
  target_max: 35
  unit: "%"
  info: "Hos utrænede mænd ligger muskelmassen normalt på 38-44%, mens den hos kvinder typisk udgør 30-35% af kropsvægten."

- q: "Hvor mange kilo vejer selve knogleskelettet (de tørre, uorganiske knoglemineraler) hos en voksen person på 75 kg?"
  target_min: 3.0
  target_max: 4.2
  unit: "kg"
  info: "Selvom skelettet bærer hele kroppen, udgør selve den rene mineralmasse (knogleaske) kun ca. 4-5% af den samlede kropsvægt."

- q: "Hvad er den absolutte nedre fysiologiske grænse for fedtprocent (essentielt fedt) hos kvinder, før hormonbalancen påvirkes kritisk?"
  target_min: 10
  target_max: 13
  unit: "%"
  info: "Kvindekroppen har brug for mindst 10-13% fedt til brystvæv, reproduktionsorganer og hormonproduktion, mod blot 3-5% hos mænd."

- q: "Hvor mange kilo vejer en voksens samlede hudoverflade i gennemsnit (uden det underliggende fedtlag)?"
  target_min: 3.5
  target_max: 5.0
  unit: "kg"
  info: "Huden er kroppens største organ og vejer typisk mellem 3,5 og 5 kg svarende til omkring 6-7% af kropsvægten."

