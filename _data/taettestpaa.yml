- q: "Hvor mange gentagelser (reps) pr. sæt anbefaler kursistmanualen som minimum, hvis målet specifikt er muskeludholdenhed og stabilitet?"
  target: 15
  unit: "reps"
  info: "Manualen angiver over 15 reps til muskeludholdenhed/stabilitet, 8-15 reps til hypertrofi og 1-8 reps til maksimal styrke."

- q: "Hvor mange minutters pause anbefaler manualen mellem sættene, når der trænes tung maksimal styrke (1-8 RM)?"
  target_min: 2
  target_max: 5
  unit: "minutter"
  info: "For at nervesystemet og depoterne af ATP og kreatinfosfat kan nå at genoplades, anbefales 2-5 minutters pause ved høj belastning."

- q: "Hvor mange døgn (24-timers perioder) tager det ifølge manualen for en muskelgruppe at restituere og superkompensere efter hård træning (5-8 RM)?"
  target_min: 2
  target_max: 4
  unit: "døgn"
  info: "Manualens restitutionstabel angiver 2-4 døgn (48-96 timer) ved høj intensitet (5-8 RM), mens moderat træning kræver 1-3 døgn."

- q: "Hvor mange procent (%) anbefales det som tommelfingerregel maksimalt at øge den ugentlige træningsvolumen med for at forebygge overbelastning?"
  target: 10
  unit: "%"
  info: "Den klassiske '10-procents regel' er en udbredt tommelfingerregel i træningslæren for at give sener, ledbånd og knogler tid til at adaptere."