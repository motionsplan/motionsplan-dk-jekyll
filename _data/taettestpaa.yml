# =============================================================================

- q: "Hvor mange milliliter (ml) blod pumper hjertet ud pr. slag (slagvolumen) i hvile hos en almindelig utrænet voksen person?"
  target_min: 60
  target_max: 80
  unit: "ml/slag"
  info: "Hvileslagvolumen er typisk ca. 70 ml. Hos en veltrænet udholdenhedsatlet under maksimalt arbejde kan det overstige 180-200 ml pr. slag!"

- q: "Hvor mange slag pr. minut (+/-) er den typiske statistiske standardafvigelse på formlen '220 minus alder' for maxpuls?"
  target_min: 10
  target_max: 12
  unit: "slag/min"
  info: "Formlen rammer kun gennemsnittet for en population; omkring 68% af befolkningen afviger med op til +/- 10-12 slag fra det beregnede tal."

- q: "Ved hvilken fast blodlaktat-koncentration i millimol pr. liter (mmol/L) defineres den fysiologiske tærskel OBLA standardmæssigt i tests?"
  target: 4.0
  unit: "mmol/L"
  info: "4,0 mmol/L er den internationale standard for OBLA (Onset of Blood Lactate Accumulation), hvor mælkesyreproduktionen for alvor stiger stejlt."

- q: "Hvad er det højeste målte kondital (VO2-max i ml O2/min/kg) for kvindelige eliteudøvere (f.eks. langrendsløbere)?"
  target_min: 76
  target_max: 82
  unit: "ml O2/min/kg"
  info: "Kvindelige verdensklasseatleter i langrend og maraton når op omkring 76-82 ml/min/kg. Rekorden for mænd er over 96."

