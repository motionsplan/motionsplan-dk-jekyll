- q: "Hvad er det gennemsnitlige samlede blodvolumen i liter hos en voksen mand på 80 kg?"
  target_min: 5.0
  target_max: 5.5
  unit: "liter"
  info: "Ifølge Nadlers formel har en mand på 180 cm og 80 kg ca. 5,3 liter blod i kroppen."

- q: "Hvad er det beregnede hvilestofskifte / BMR (Basal Metabolic Rate) i kalorier pr. døgn for en 30-årig mand på 180 cm og 80 kg?"
  target_min: 1750
  target_max: 1820
  unit: "kcal/døgn"
  info: "Mifflin-St Jeor-ligningen estimerer basalt energiforbrug til ca. 1.780 kcal i ren liggende hvile."

- q: "Hvor mange liter udgør det samlede kropsrumfang for en person på 80 kg (ved normal kropsdensitet på ca. 1,06 kg/L)?"
  target_min: 74.0
  target_max: 77.0
  unit: "liter"
  info: "Kroppen består mest af vand og væv med en massefylde tæt på 1,06 g/ml, hvilket giver ca. 75,5 liter rumfang."

- q: "Hvad er hudens samlede overfladeareal (Body Surface Area - BSA) i kvadratmeter (m²) hos en person på 180 cm og 80 kg?"
  target: 2.00
  unit: "m²"
  info: "Mosteller-formlen estimerer overfladearealet til præcis 2,00 m² for en person med disse mål."

- q: "Hvad er den forventede vitalkapacitet i lungerne (FVC) i liter hos en sund og rask 30-årig mand på 180 cm?"
  target_min: 4.8
  target_max: 5.3
  unit: "liter"
  info: "Vitalkapaciteten afhænger primært af køn, alder og kropshøjde, og ligger typisk omkring 5,1 liter for denne profil."

- q: "Hvor mange liter væske (dagligt vandbehov) anbefales en person på 80 kg som minimum at indtage pr. døgn ved normal aktivitet?"
  target_min: 2.5
  target_max: 3.0
  unit: "liter/dag"
  info: "Tommelfingerreglen siger 30-35 ml væske pr. kg kropsvægt, svarende til ca. 2,8 liter om dagen for en person på 80 kg."

- q: "Hvad regnes for en normal og sund fedtprocent for en aktiv ung mand i alderen 20-39 år?"
  target_min: 12.0
  target_max: 20.0
  unit: "%"
  info: "For mænd regnes 12-20% som almindeligt sundt referenceområde. For kvinder ligger normalen typisk på 20-30%."

- q: "Hvad er den anbefalede øvre grænse for Talje-Højde Ratio (WHtR) for at undgå øget risiko for livsstilssygdomme?"
  target: 0.50
  unit: "ratio"
  info: "En tommelfingerregel er, at taljemålet højst bør være halvdelen af ens højde (WHtR under 0,50)."

